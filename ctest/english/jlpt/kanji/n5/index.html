<script>
/* ═══ DATA PATTERN — loaded from kanji.json (array of entries) ═══
   Each kanji entry:
   {
     kanji, yomikata, onyomi, kunyomi, stroke_count,
     english_meaning, nepali_meaning,
     stroke_instruction_jp, stroke_instruction_en,
     examples: [{ example /* HTML with <ruby><rt> furigana , eng, nepali }]
   }
*/
let KANJI_LIST = [];
let currentIndex = 0;
let lang = 'np'; // 'np' | 'en'
let isDark = false;

const params = new URLSearchParams(location.search);
currentIndex = parseInt(params.get('i'), 10) || 0;

fetch('kanji.json')
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(data => {
    KANJI_LIST = Array.isArray(data) ? data : (data.kanji || data.words || []);
    if (!KANJI_LIST.length) throw new Error('No data in kanji.json');
    if (currentIndex < 0 || currentIndex >= KANJI_LIST.length) currentIndex = 0;
    render();
    updateNavButtons();
  })
  .catch(err => {
    document.getElementById('kanji-yomikata').textContent = 'Could not load kanji.json';
    document.getElementById('kanji-meaning').textContent = err.message;
    console.error(err);
  });

/* ── Render (language-aware) ── */
function render() {
  const k = KANJI_LIST[currentIndex];
  if (!k) return;
  document.getElementById('kanji-glyph').textContent = k.kanji;
  document.getElementById('kanji-yomikata').textContent = `${k.kanji}（${k.yomikata}）`;
  document.getElementById('kanji-meaning').textContent = lang === 'np' ? (k.nepali_meaning || k.english_meaning) : k.english_meaning;
  document.getElementById('meaning-label').textContent = lang === 'np' ? 'अर्थ' : 'Meaning';
  document.getElementById('onyomi-text').textContent = k.onyomi;
  document.getElementById('kunyomi-text').textContent = k.kunyomi;
  document.getElementById('stroke-count-badge').textContent = `${k.stroke_count ?? '—'} 画`;
  document.getElementById('stroke-instr-jp').textContent = k.stroke_instruction_jp || '';
  document.getElementById('stroke-instr-en').textContent = k.stroke_instruction_en || '';
  document.getElementById('stroke-instr-jp-desktop').textContent = k.stroke_instruction_jp || '';
  document.getElementById('stroke-instr-en-desktop').textContent = k.stroke_instruction_en || '';
  document.getElementById('kanji-position').textContent = `${currentIndex+1} / ${KANJI_LIST.length}`;

  const list = document.getElementById('examples-list');
  list.innerHTML = '';
  const exArr = k.examples || [];
  exArr.forEach((ex, i) => {
    const translation = lang === 'np' ? (ex.nepali || ex.eng) : ex.eng;
    const isLast = i === exArr.length - 1;
    const card = document.createElement('div');
    card.className = `ex-card fu w-full p-4 flex gap-3 items-start relative overflow-hidden ${isLast ? '' : 'border-b border-slate-100 divider'} lg:rounded-xl2 lg:border lg:border-slate-100 lg:divider`;
    card.innerHTML = `
      <div class="flex-1 min-w-0">
        <div class="ex-text jp font-bold t-ink mb-2">${ex.example}</div>
        <div class="text-base font-semibold" style="color:#2a9d8f;">${esc(translation)}</div>
      </div>
      <span class="absolute -right-2 -bottom-2 text-3xl opacity-70 select-none pointer-events-none">🌸</span>
    `;
    list.appendChild(card);
  });

  // Reset stroke-order accordion + writer(s) for the new kanji
  strokeInitialized = { mobile: false, desktop: false };
  strokeOpen = false;
  document.getElementById('stroke-panel').style.display = 'none';
  document.getElementById('stroke-panel-desktop').style.display = 'none';
  document.getElementById('examples-panel').style.display = '';
  document.getElementById('stroke-chevron').style.transform = '';
  const quizMsg = document.getElementById('stroke-quiz-msg');
  if (quizMsg) { quizMsg.style.display = 'none'; quizMsg.textContent = ''; }
  const quizMsgDesktop = document.getElementById('stroke-quiz-msg-desktop');
  if (quizMsgDesktop) { quizMsgDesktop.style.display = 'none'; quizMsgDesktop.textContent = ''; }
}

/* ── Prev / Next navigation ── */
function goPrev() {
  if (currentIndex <= 0) return;
  currentIndex--;
  syncUrl();
  render();
  updateNavButtons();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function goNext() {
  if (currentIndex >= KANJI_LIST.length - 1) return;
  currentIndex++;
  syncUrl();
  render();
  updateNavButtons();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function syncUrl() {
  const url = new URL(location.href);
  url.searchParams.set('i', currentIndex);
  history.replaceState(null, '', url);
}
function updateNavButtons() {
  const prevBtn = document.getElementById('prev-kanji-btn');
  const nextBtn = document.getElementById('next-kanji-btn');
  prevBtn.disabled = currentIndex <= 0;
  nextBtn.disabled = currentIndex >= KANJI_LIST.length - 1;
}

function toggleLang() {
  lang = lang === 'np' ? 'en' : 'np';
  const label = lang === 'np' ? '🇳🇵 NP' : '🇬🇧 EN';
  const mobBtn = document.getElementById('lang-btn'); if (mobBtn) mobBtn.textContent = label;
  const deskBtn = document.getElementById('lang-btn-desktop'); if (deskBtn) deskBtn.textContent = label;
  render();
}

/* ── Dark mode ── */
const MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
const SUN  = '<path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/><circle cx="12" cy="12" r="4"/>';
function toggleDark() {
  isDark = !isDark;
  document.body.className = isDark ? 'mesh-dark min-h-screen text-slate-100 dark' : 'mesh-light min-h-screen text-ink';
  const icon = document.getElementById('mob-icon'); if (icon) icon.innerHTML = isDark ? SUN : MOON;
  const deskIcon = document.getElementById('desk-icon'); if (deskIcon) deskIcon.innerHTML = isDark ? SUN : MOON;
}

/* ── Bookmark ── */
let bookmarked = false;
function toggleBookmark() {
  bookmarked = !bookmarked;
  const btn = document.getElementById('bookmark-btn');
  const icon = document.getElementById('bookmark-icon');
  if (bookmarked) { icon.setAttribute('fill', '#3a7cbf'); btn.style.borderColor = '#3a7cbf'; icon.style.stroke = '#3a7cbf'; }
  else { icon.setAttribute('fill', 'none'); btn.style.borderColor = ''; icon.style.stroke = 'currentColor'; }
}

/* ── Text-to-speech ── */
function speakJa(text, btn) {
  if (!text) return;
  if (btn && btn.classList.contains('speaking')) { window.speechSynthesis.cancel(); btn.classList.remove('speaking'); return; }
  document.querySelectorAll('.speaking').forEach(b => b.classList.remove('speaking'));
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = 0.85;
  const voices = window.speechSynthesis.getVoices();
  const jpV = voices.find(v => v.lang.startsWith('ja')); if (jpV) u.voice = jpV;
  if (btn) { u.onstart = () => btn.classList.add('speaking'); u.onend = u.onerror = () => btn.classList.remove('speaking'); }
  window.speechSynthesis.speak(u);
}
function speakExample(html, btn) {
  const div = document.createElement('div'); div.innerHTML = html;
  div.querySelectorAll('rt').forEach(rt => rt.remove());
  speakJa(div.textContent || div.innerText || '', btn);
}
document.getElementById('glyph-speak').addEventListener('click', function(){ speakJa(KANJI_LIST[currentIndex].kanji, this); });
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  if (window.speechSynthesis.onvoiceschanged !== undefined) window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

/* ── Stroke order writer (HanziWriter) — one instance for the mobile
   inline panel, one for the desktop practice panel ── */
let strokeWriters = { mobile: null, desktop: null };
const STROKE_TARGET_IDS = { mobile: 'stroke-writer-target', desktop: 'stroke-writer-target-desktop' };
const STROKE_SIZES = { mobile: 180, desktop: 260 };

function initStroke(key) {
  const targetId = STROKE_TARGET_IDS[key];
  const size = STROKE_SIZES[key];
  const target = document.getElementById(targetId);
  target.innerHTML = '';
  try {
    const writer = HanziWriter.create(targetId, KANJI_LIST[currentIndex].kanji, {
      width: size, height: size, padding: 10,
      showOutline: true,
      strokeColor: '#2a9d8f',
      outlineColor: '#e2e8f0',
      strokeAnimationSpeed: 1,
      delayBetweenStrokes: 300,
      delayBetweenLoops: 1500,
      loopCharacterAnimation: true,
    });
    writer.loopCharacterAnimation();
    strokeWriters[key] = writer;
  } catch (e) {
    target.innerHTML = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:4rem;font-family:'Noto Sans JP',sans-serif;color:#2a9d8f;">${KANJI_LIST[currentIndex].kanji}</div>`;
  }
}
function replayStroke(key) { if (strokeWriters[key]) strokeWriters[key].animateCharacter(); }

function quizStroke(key) {
  key = key || 'mobile';
  const writer = strokeWriters[key];
  if (!writer) return;
  const msg = document.getElementById(key === 'desktop' ? 'stroke-quiz-msg-desktop' : 'stroke-quiz-msg');
  msg.style.display = 'block';
  msg.textContent = 'Draw the kanji!';
  writer.quiz({
    onComplete: () => { msg.textContent = '✅ Well done!'; },
    onMistake: () => { msg.textContent = '✏️ Try again…'; }
  });
}

let strokeInitialized = { mobile: false, desktop: false };
let strokeOpen = false;
function toggleStrokeSection() {
  strokeOpen = !strokeOpen;
  const chevron = document.getElementById('stroke-chevron');
  chevron.style.transform = strokeOpen ? 'rotate(180deg)' : '';

  const isDesktop = window.matchMedia('(min-width: 1024px)').matches;

  if (isDesktop) {
    // On desktop, Practice takes over the wide examples area instead of
    // cramming into the narrow left column.
    const panel = document.getElementById('stroke-panel');
    panel.style.display = 'none';

    const examplesPanel = document.getElementById('examples-panel');
    const strokeDesktop = document.getElementById('stroke-panel-desktop');
    examplesPanel.style.display = strokeOpen ? 'none' : '';
    strokeDesktop.style.display = strokeOpen ? 'flex' : 'none';

    if (strokeOpen && !strokeInitialized.desktop) {
      strokeInitialized.desktop = true;
      initStroke('desktop');
    }
  } else {
    const panel = document.getElementById('stroke-panel');
    panel.style.display = strokeOpen ? '' : 'none';
    if (strokeOpen && !strokeInitialized.mobile) {
      strokeInitialized.mobile = true;
      initStroke('mobile');
    }
    if (strokeOpen) {
      // Scroll the panel into view within the page (mobile scrolls the body).
      requestAnimationFrame(() => {
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    }
  }
}

/* ── Scroll-direction nav show/hide (mobile only) ── */
(function(){
  let lastY = window.scrollY;
  const topbar = document.getElementById('topbar');
  const botnav = document.getElementById('botnav');
  window.addEventListener('scroll', function(){
    if (window.innerWidth >= 1024) return; // desktop never scrolls the page
    const y = window.scrollY;
    const goingDown = y > lastY;
    if (y < 10) { topbar.style.transform = 'translateY(0)'; botnav.style.transform = 'translateY(0)'; }
    else if (goingDown) { botnav.style.transform = 'translateY(100%)'; topbar.style.transform = 'translateY(0)'; }
    else { topbar.style.transform = 'translateY(-100%)'; botnav.style.transform = 'translateY(0)'; }
    lastY = y;
  }, { passive: true });
})();

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

</script>
