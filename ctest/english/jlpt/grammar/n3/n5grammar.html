epali": "घर पुगेपछि फोन गर्छु।"}]}, {"lesson": "Lesson 25", "grammar_point": "Concession: ても／でも (even if)", "form": "…ても／でも、～", "english_explanation": "Says a result happens regardless of a certain condition or action — 'even if ~'.", "nepali_explanation": "कुनै अवस्था वा कार्य जेसुकै भए पनि परिणाम उही हुन्छ भन्ने कुरा बताउँछ — 'भए पनि'।", "examples": [{"japanese": "いそがしくても、うんどうします。", "romaji": "Isogashikutemo, undō shimasu.", "english": "Even if I'm busy, I exercise.", "nepali": "व्यस्त भए पनि व्यायाम गर्छु।"}]}, {"lesson": "Lesson 25", "grammar_point": "もし／いくら (if / no matter how much)", "form": "もし～たら／いくら～ても", "english_explanation": "もし pairs with the ら-conditional to mean 'if'; いくら pairs with ても/でも to mean 'no matter how much'.", "nepali_explanation": "もし ले ら-सशर्त वाक्यसँग 'यदि' भन्ने अर्थ दिन्छ; いくら ले ても/でも सँग 'जतिनै' भन्ने अर्थ दिन्छ।", "examples": [{"japanese": "いくら さそっても、かれは きません。", "romaji": "Ikura sasottemo, kare wa kimasen.", "english": "No matter how much I invite him, he won't come.", "nepali": "जतिसुकै निम्तो दिए पनि, उ आउँदैन।"}]}, {"lesson": "Lesson 25", "grammar_point": "Subordinate Clause Subject with が", "form": "subordinate clause の subject が", "english_explanation": "In a subordinate clause (such as a まえに clause), the subject is marked with が rather than は.", "nepali_explanation": "अधीनस्थ वाक्यांश (जस्तै まえに) मा विषयलाई は को सट्टा が ले संकेत गरिन्छ।", "examples": [{"japanese": "あめが ふる まえに、いえに かえりましょう。", "romaji": "Ame ga furu mae ni, ie ni kaerimashō.", "english": "Let's go home before it rains.", "nepali": "पानी पर्नुअघि घर फर्कौं।"}]}]</script>
<script>
const DATA = JSON.parse(document.getElementById('grammar-data').textContent);

function furigana(text){
  // convert Kanji(furigana) into <ruby> markup
  return text.replace(/([\u4E00-\u9FFF々〆ヵヶ]+)\(([\u3040-\u309F]+)\)/g,
    (m, kanji, kana) => `<ruby>${kanji}<rt>${kana}</rt></ruby>`);
}

const lessonOrder = [...new Set(DATA.map(d => d.lesson))]
  .sort((a,b) => parseInt(a.replace('Lesson ','')) - parseInt(b.replace('Lesson ','')));

const lessonListEl = document.getElementById('lessonList');
const cardGrid = document.getElementById('cardGrid');
const lessonHeadJp = document.getElementById('lessonHeadJp');
const lessonHeadCount = document.getElementById('lessonHeadCount');
const searchBox = document.getElementById('searchBox');

document.getElementById('statLessons').textContent = lessonOrder.length;
document.getElementById('statPoints').textContent = DATA.length;

let currentLesson = lessonOrder[0];
let currentQuery = '';

function buildSidebar(){
  lessonListEl.innerHTML = '';
  lessonOrder.forEach(lesson => {
    const num = lesson.replace('Lesson ','');
    const li = document.createElement('li');
    li.className = 'lesson-item' + (lesson === currentLesson ? ' active' : '');
    li.innerHTML = `<span class="lesson-num">${num}</span><span>पाठ ${num}</span>`;
    li.addEventListener('click', () => { currentLesson = lesson; searchBox.value=''; currentQuery=''; render(); });
    lessonListEl.appendChild(li);
  });
}

function matchesQuery(item, q){
  if(!q) return true;
  q = q.toLowerCase();
  const hay = [
    item.grammar_point, item.form, item.english_explanation, item.nepali_explanation,
    ...item.examples.flatMap(e => [e.japanese, e.romaji, e.english, e.nepali])
  ].join(' ').toLowerCase();
  return hay.includes(q);
}

function render(){
  buildSidebar();

  let items;
  if(currentQuery){
    items = DATA.filter(d => matchesQuery(d, currentQuery));
    lessonHeadJp.textContent = 'खोज परिणाम';
    lessonHeadCount.textContent = `${items.length} matches`;
  } else {
    items = DATA.filter(d => d.lesson === currentLesson);
    const num = currentLesson.replace('Lesson ','');
    lessonHeadJp.textContent = `第${num}課`;
    lessonHeadCount.textContent = `${items.length} grammar points`;
  }

  cardGrid.innerHTML = '';
  if(items.length === 0){
    cardGrid.innerHTML = `<div class="empty-state">केही भेटिएन 🍃<br>No results found.</div>`;
    return;
  }

  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    const examplesHtml = item.examples.map(e => `
      <div class="example">
        <div class="jp">${furigana(e.japanese)}</div>
        <div class="romaji">${e.romaji}</div>
        <div class="translations">
          <span class="en tag-en">${e.english}</span>
          <span class="np tag-np">${e.nepali}</span>
        </div>
      </div>
    `).join('');

    card.innerHTML = `
      <div class="card-head">
        <h3 class="point-title">${furigana(item.grammar_point)}</h3>
        <div class="form-chip">${furigana(item.form)}</div>
      </div>
      <div class="expl-block">
        <div class="expl-label">नेपाली व्याख्या</div>
        <p class="expl-text np">${item.nepali_explanation}</p>
        <div class="expl-label">English</div>
        <p class="expl-text en">${item.english_explanation}</p>
      </div>
      <div class="examples">${examplesHtml}</div>
    `;
    cardGrid.appendChild(card);
  });
}

searchBox.addEventListener('input', (e) => {
  currentQuery = e.target.value.trim();
  render();
});

render();
</script>
</body>
</html>
