<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文法帖 &mdash; N5 व्याकरण पत्रिका</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --washi:#F1EADA;
    --washi-deep:#E7DDC6;
    --ink:#2B241C;
    --ink-soft:#5B5142;
    --indigo:#233A5E;
    --indigo-deep:#152238;
    --sakura:#D8768E;
    --sakura-deep:#B5556E;
    --gold:#B08D4F;
    --line:#D8CBA9;
    --card:#FBF7EC;
    --shadow: 0 1px 0 rgba(43,36,28,.06), 0 8px 24px -12px rgba(43,36,28,.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 100% -10%, #f7f2e4 0%, transparent 60%),
      var(--washi);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', 'Noto Sans Devanagari', sans-serif;
    min-height:100vh;
  }
  .fude-texture{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.35;
    background-image:
      repeating-linear-gradient(115deg, rgba(43,36,28,0.015) 0px, rgba(43,36,28,0.015) 1px, transparent 1px, transparent 3px);
  }

  /* ================= HEADER ================= */
  header.hero{
    position:relative; z-index:1;
    background:
      linear-gradient(180deg, var(--indigo) 0%, var(--indigo-deep) 100%);
    color:#F1EADA;
    padding:28px clamp(16px,4vw,56px) 34px;
    overflow:hidden;
    border-bottom: 3px solid var(--gold);
  }
  header.hero::before{
    content:"";
    position:absolute; right:-60px; top:-60px; width:340px; height:340px;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, rgba(216,118,142,.5), rgba(216,118,142,0) 65%);
  }
  .hero-inner{ position:relative; display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; }
  .hero-title-block{ display:flex; align-items:center; gap:18px; }
  .seal{
    flex:none;
    width:64px; height:64px; border-radius:10px;
    background: var(--sakura);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:'Shippori Mincho', serif;
    font-size:26px; font-weight:800;
    writing-mode: vertical-rl;
    box-shadow: 0 6px 18px -6px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.25);
    letter-spacing:2px;
  }
  h1{
    margin:0;
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size: clamp(28px, 4.4vw, 46px);
    line-height:1.1;
    letter-spacing:.02em;
  }
  h1 .sub-en{
    display:block;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:500;
    font-size:14px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:#C9B27B;
    margin-bottom:6px;
  }
  h1 .np{
    display:block;
    font-family:'Noto Sans Devanagari', sans-serif;
    font-weight:600;
    font-size: clamp(16px,2vw,22px);
    color:#E9DEC4;
    margin-top:6px;
    letter-spacing:0;
  }
  .hero-stats{
    display:flex; gap:22px; font-family:'Noto Sans Devanagari', sans-serif;
  }
  .hero-stats div{ text-align:right; }
  .hero-stats .num{ font-family:'Shippori Mincho', serif; font-size:30px; font-weight:700; color:#F1EADA; }
  .hero-stats .lbl{ font-size:12px; color:#B9A98A; letter-spacing:.08em; }

  /* ================= LAYOUT ================= */
  .layout{
    position:relative; z-index:1;
    display:grid;
    grid-template-columns: 232px 1fr;
    gap:0;
    max-width:1280px;
    margin:0 auto;
  }
  @media (max-width: 860px){
    .layout{ grid-template-columns: 1fr; }
  }

  /* ================= SIDEBAR (fan of lessons) ================= */
  nav.rail{
    padding: 22px 12px 60px 22px;
    position:sticky; top:0; align-self:start;
    max-height:100vh; overflow-y:auto;
  }
  @media (max-width:860px){ nav.rail{ position:static; max-height:none; padding:18px 16px; } }
  .rail-label{
    font-family:'Noto Sans Devanagari'; font-weight:700; font-size:12.5px;
    color:var(--ink-soft); text-transform:uppercase; letter-spacing:.1em;
    margin: 4px 0 10px 4px;
  }
  .search-box{
    width:100%; padding:9px 12px; margin-bottom:14px;
    border:1px solid var(--line); border-radius:8px;
    background:var(--card); color:var(--ink);
    font-family:'Noto Sans Devanagari'; font-size:13.5px;
  }
  .search-box:focus{ outline:none; border-color:var(--sakura-deep); }
  .lesson-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
  .lesson-item{
    display:flex; align-items:center; gap:10px;
    padding:7px 10px; border-radius:8px; cursor:pointer;
    font-family:'Noto Sans Devanagari'; font-size:13.5px; color:var(--ink-soft);
    border-left:3px solid transparent;
    transition: background .15s, color .15s, border-color .15s;
  }
  .lesson-item:hover{ background: rgba(216,118,142,.09); color:var(--ink); }
  .lesson-item.active{
    background: var(--indigo); color:#F1EADA; border-left-color:var(--sakura);
    font-weight:600;
  }
  .lesson-num{
    flex:none; width:24px; height:24px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Shippori Mincho', serif; font-weight:700; font-size:12px;
    background: var(--washi-deep); color:var(--ink);
  }
  .lesson-item.active .lesson-num{ background:var(--sakura); color:#fff; }

  /* ================= MAIN ================= */
  main{ padding: 30px clamp(14px,3vw,40px) 90px; min-width:0; }
  .lesson-heading{
    display:flex; align-items:baseline; gap:14px; margin-bottom:22px;
    border-bottom: 2px solid var(--line); padding-bottom:14px;
  }
  .lesson-heading .jp{
    font-family:'Shippori Mincho', serif; font-weight:800; font-size:30px; color:var(--indigo-deep);
  }
  .lesson-heading .count{
    font-family:'Noto Sans Devanagari'; font-size:13px; color:var(--ink-soft);
    background:var(--washi-deep); padding:3px 10px; border-radius:999px;
  }

  .grid{ display:flex; flex-direction:column; gap:18px; }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 22px 18px;
    box-shadow: var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:5px;
    background: linear-gradient(180deg, var(--sakura), var(--indigo));
  }
  .card-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  .point-title{
    font-family:'Shippori Mincho', serif; font-weight:700; font-size:19px; color:var(--indigo-deep);
    margin:0;
  }
  .form-chip{
    font-family:'Noto Serif JP', serif; font-size:14.5px;
    background: var(--indigo); color:#F1EADA;
    padding:5px 12px; border-radius:8px; white-space:nowrap;
  }
  .expl-block{ margin-top:10px; }
  .expl-label{
    font-family:'Noto Sans Devanagari'; font-weight:700; font-size:11.5px;
    letter-spacing:.08em; text-transform:uppercase; color:var(--gold);
    margin-bottom:3px; display:flex; align-items:center; gap:6px;
  }
  .expl-label::before{ content:""; width:14px; height:1px; background:var(--gold); display:inline-block; }
  p.expl-text{
    margin:0 0 12px 0; line-height:1.75; font-size:14.5px; color:var(--ink);
  }
  p.expl-text.np{ font-family:'Noto Sans Devanagari'; font-size:15px; }
  p.expl-text.en{ font-family:'Zen Kaku Gothic New'; color:var(--ink-soft); }

  .examples{ margin-top:14px; display:flex; flex-direction:column; gap:10px; }
  .example{
    background: var(--washi);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
  }
  .example .jp{
    font-family:'Shippori Mincho', serif; font-size:19px; line-height:2.05;
    color:var(--ink); margin-bottom:4px;
  }
  ruby rt{ font-family:'Noto Sans Devanagari','Zen Kaku Gothic New'; font-size:10px; color:var(--sakura-deep); }
  .example .romaji{ font-size:12.5px; color:var(--ink-soft); font-style:italic; margin-bottom:6px; }
  .example .translations{ display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13.5px; }
  .example .translations .en{ color:var(--ink-soft); }
  .example .translations .np{ font-family:'Noto Sans Devanagari'; color:var(--indigo-deep); font-weight:500; }
  .tag-en::before{ content:"EN "; font-size:10px; color:var(--gold); font-weight:700; }
  .tag-np::before{ content:"ने "; font-size:10px; color:var(--gold); font-weight:700; }

  .empty-state{
    text-align:center; padding:80px 20px; color:var(--ink-soft);
    font-family:'Noto Sans Devanagari';
  }

  footer{
    text-align:center; padding:26px 16px 40px; color:var(--ink-soft);
    font-family:'Noto Sans Devanagari'; font-size:12.5px;
    border-top:1px solid var(--line);
  }

  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
</style>
</head>
<body>
<div class="fude-texture"></div>

<header class="hero">
  <div class="hero-inner">
    <div class="hero-title-block">
      <div class="seal">語</div>
      <h1>
        <span class="sub-en">Japanese N5 &middot; Grammar Companion</span>
        文法帖
        <span class="np">जापानी N5 व्याकरण पत्रिका &mdash; पाठ १ देखि २५ सम्म</span>
      </h1>
    </div>
    <div class="hero-stats">
      <div><div class="num" id="statLessons">25</div><div class="lbl">पाठ</div></div>
      <div><div class="num" id="statPoints">140</div><div class="lbl">व्याकरण बुँदा</div></div>
    </div>
  </div>
</header>

<div class="layout">
  <nav class="rail">
    <div class="rail-label">खोज्नुहोस्</div>
    <input class="search-box" id="searchBox" type="text" placeholder="व्याकरण खोज्नुहोस्... (search)">
    <div class="rail-label">पाठहरू &middot; Lessons</div>
    <ul class="lesson-list" id="lessonList"></ul>
  </nav>

  <main>
    <div class="lesson-heading">
      <span class="jp" id="lessonHeadJp">第1課</span>
      <span class="count" id="lessonHeadCount">6 grammar points</span>
    </div>
    <div class="grid" id="cardGrid"></div>
  </main>
</div>

<footer>桜アカデミー &middot; Sakura Academy &mdash; N5 व्याकरण सन्दर्भ, दुई भाषामा (नेपाली / English)</footer>

<script id="grammar-data" type="application/json">[{"lesson": "Lesson 1", "grammar_point": "Topic Particle は", "form": "N₁ は N₂ です。", "english_explanation": "は (written as 'ha' but pronounced 'wa' in this role) is placed right after a noun to introduce it as the topic — the thing the rest of the sentence will comment on.", "nepali_explanation": "जुनसुकै नाम वा सर्वनामको ठीक पछाडि は राखेर त्यसलाई वाक्यको मुख्य विषय बनाइन्छ। लेखिँदा は नै लेखिन्छ तर बोल्दा भने 'वा' गरी उच्चारण गरिन्छ।", "examples": [{"japanese": "ジョンさんは 会社員(かいしゃいん)です。", "romaji": "Jon-san wa kaishain desu.", "english": "Mr. John is a company employee.", "nepali": "जोनजी कम्पनी-कर्मचारी हुनुहुन्छ।"}, {"japanese": "これは 時計(とけい)です。", "romaji": "Kore wa tokei desu.", "english": "This is a watch.", "nepali": "यो घडी हो।"}]}, {"lesson": "Lesson 1", "grammar_point": "Copula です", "form": "N です。", "english_explanation": "です sits at the end of a noun sentence and functions purely as a polite linking word meaning 'is/am/are'. It has no meaning by itself beyond politeness.", "nepali_explanation": "です वाक्यको अन्त्यमा बसेर 'हो/छ' भन्ने अर्थ दिन्छ। यो केवल वाक्य नम्रतापूर्वक टुंग्याउने जोड्ने शब्द हो, आफैंमा अरू कुनै अर्थ बोक्दैन।", "examples": [{"japanese": "それは スマホです。", "romaji": "Sore wa sumaho desu.", "english": "That is a smartphone.", "nepali": "त्यो स्मार्टफोन हो।"}]}, {"lesson": "Lesson 1", "grammar_point": "Basic Pattern N₁ は N₂ です。", "form": "N₁ は N₂ です。", "english_explanation": "This forms a simple statement of identity or category: 'N₁ is N₂'. The topic comes first, followed by what is said about it, ending in です.", "nepali_explanation": "यसले 'N₁ चाँही N₂ हो' भन्ने सरल पहिचान वा वर्गसूचक वाक्य बनाउँछ। पहिले विषय, त्यसपछि त्यसको बारेमा भनिने कुरा, र अन्त्यमा です।", "examples": [{"japanese": "わたしは かんごし です。", "romaji": "Watashi wa kangoshi desu.", "english": "I am a nurse.", "nepali": "म नर्स हो।"}]}, {"lesson": "Lesson 1", "grammar_point": "Particle も (also/too)", "form": "N₃も N₂です。", "english_explanation": "When the second sentence restates the exact same category as the first, は in the second sentence is replaced with も to mean 'also/too'.", "nepali_explanation": "पहिलो वाक्य र दोस्रो वाक्यको भनाइ उस्तै भएमा, दोस्रो वाक्यको は लाई も ले बदलिन्छ जसको अर्थ 'पनि' हुन्छ।", "examples": [{"japanese": "わたしは がくせいです。かのじょも がくせいです。", "romaji": "Watashi wa gakusei desu. Kanojo mo gakusei desu.", "english": "I am a student. She is also a student.", "nepali": "म विद्यार्थी हो। उनि पनि विद्यार्थी हो।"}]}, {"lesson": "Lesson 1", "grammar_point": "Question Particle か", "form": "Sentence + か。", "english_explanation": "Attaching か to the end of any sentence turns it into a question. Yes/No questions are answered with はい or いいえ; questions containing a question-word are answered with the specific information asked for.", "nepali_explanation": "वाक्यको अन्त्यमा か थपिँदा त्यो प्रश्न बन्छ। हो/होइन प्रकारका प्रश्नको उत्तर はい वा いいえ मा दिइन्छ; प्रश्नवाचक शब्द भएका प्रश्नको उत्तरमा भने सोधिएको खास जानकारी नै दिनुपर्छ।", "examples": [{"japanese": "たなかさんは がくせいですか。", "romaji": "Tanaka-san wa gakusei desu ka.", "english": "Is Ms. Tanaka a student?", "nepali": "तानाकाजी विद्यार्थी हुनुहुन्छ?"}]}, {"lesson": "Lesson 1", "grammar_point": "Possessive Particle の", "form": "N₁ の N₂", "english_explanation": "の joins two nouns to show possession or a descriptive relationship, similar to English 's or 'of'.", "nepali_explanation": "の ले दुई नामलाई जोडेर स्वामित्व अथवा वर्णनात्मक सम्बन्ध देखाउँछ, अंग्रेजीको 's जस्तै।", "examples": [{"japanese": "かのじょの かさ です。", "romaji": "Kanojo no kasa desu.", "english": "It is her umbrella.", "nepali": "त्यो उनको छाता हो।"}]}, {"lesson": "Lesson 2", "grammar_point": "Demonstrative Pronouns これ／それ／あれ", "form": "これ／それ／あれ は N です。", "english_explanation": "These stand alone (not followed by a noun) and point at objects based on physical distance: これ = near the speaker, それ = near the listener, あれ = far from both.", "nepali_explanation": "यी एक्लै प्रयोग हुने प्रदर्शक शब्द हुन् (यिनको पछाडि नाम आउँदैन) र भौतिक दूरीअनुसार वस्तु देखाउँछन्: これ वक्ता नजिकको, それ श्रोता नजिकको, र あれ दुबैभन्दा टाढाको वस्तु।", "examples": [{"japanese": "それは なんですか。", "romaji": "Sore wa nan desu ka.", "english": "What is that?", "nepali": "त्यो के हो?"}]}, {"lesson": "Lesson 2", "grammar_point": "この／その／あの + Noun", "form": "この N／その N／あの N", "english_explanation": "Unlike これ/それ/あれ, these three cannot stand alone — a noun must always follow immediately after them.", "nepali_explanation": "これ/それ/あれ फरक, यी तीनवटा एक्लै उभिन सक्दैनन् — यिनको ठीक पछाडि सधैं नाम आउनैपर्छ।", "examples": [{"japanese": "この ノートは わたしのです。", "romaji": "Kono nōto wa watashi no desu.", "english": "This notebook is mine.", "nepali": "यो नोटबुक मेरो हो।"}]}, {"lesson": "Lesson 2", "grammar_point": "そうです／そうじゃ ありません", "form": "そうです。／ そうじゃ ありません。", "english_explanation": "A short way to confirm (そうです) or deny (そうじゃ ありません) something someone just said.", "nepali_explanation": "कसैले भर्खर भनेको कुरालाई छोटकरीमा पुष्टि (そうです) अथवा अस्वीकार (そうじゃ ありません) गर्ने तरिका।", "examples": [{"japanese": "A: それは くつですか。 B: いいえ、そうじゃ ありません。", "romaji": "Sore wa kutsu desu ka. Iie, sō ja arimasen.", "english": "Is that a shoe? No, it isn't.", "nepali": "त्यो जुत्ता हो? होइन, त्यसो होइन।"}]}, {"lesson": "Lesson 2", "grammar_point": "Choice Question S₁か、S₂か。", "form": "S₁か、S₂か。", "english_explanation": "Presents two options and asks the listener to pick one; the answer is never はい/いいえ but rather one of the two named options.", "nepali_explanation": "दुईवटा विकल्प दिएर श्रोतालाई एउटा छान्न भन्ने प्रश्न; उत्तर कहिल्यै はい/いいえ हुँदैन, दुई मध्ये एउटा विकल्प नै भन्नुपर्छ।", "examples": [{"japanese": "これは えんぴつですか、ペンですか。", "romaji": "Kore wa enpitsu desu ka, pen desu ka.", "english": "Is this a pencil or a pen?", "nepali": "यो पेन्सिल हो कि कलम हो?"}]}, {"lesson": "Lesson 2", "grammar_point": "N₁ の N₂ (belonging)", "form": "N₁ の N₂", "english_explanation": "Shows that N2 belongs to or is closely connected with N1.", "nepali_explanation": "N2 चाँही N1 सँग सम्बन्धित छ वा त्यसैको हो भनेर देखाउँछ।", "examples": [{"japanese": "せんせいの じてんしゃ です。", "romaji": "Sensei no jitensha desu.", "english": "It's the teacher's bicycle.", "nepali": "त्यो शिक्षकको साइकल हो।"}]}, {"lesson": "Lesson 2", "grammar_point": "そうですか (oh, I see)", "form": "そうですか。", "english_explanation": "A reaction phrase showing the speaker has absorbed newly heard information.", "nepali_explanation": "भर्खरै सुनेको नयाँ जानकारी बुझेको जनाउने प्रतिक्रिया-वाक्यांश।", "examples": [{"japanese": "しゅみは しゃしんです。 そうですか。", "romaji": "Shumi wa shashin desu. Sō desu ka.", "english": "My hobby is photography. Oh, I see.", "nepali": "शौक फोटोग्राफी हो। ए, हो र।"}]}, {"lesson": "Lesson 2", "grammar_point": "Polite prefix お～", "form": "お + Noun", "english_explanation": "Attached before certain words purely to sound more polite; it adds no independent meaning of its own.", "nepali_explanation": "शब्दलाई नम्र सुनाउनकोलागि मात्र अगाडि थपिने; यसको आफ्नै छुट्टै अर्थ हुँदैन।", "examples": [{"japanese": "おちゃ (tea, polite)", "romaji": "o-cha", "english": "tea", "nepali": "चिया"}]}, {"lesson": "Lesson 3", "grammar_point": "ここ/そこ/あそこ/どこ and こちら/そちら/あちら/どちら", "form": "ここ／そこ／あそこ／どこ", "english_explanation": "ここ/そこ/あそこ point to a physical place; こちら/そちら/あちら are their polite equivalents and can additionally indicate a direction.", "nepali_explanation": "ここ/そこ/あそこ ले भौतिक ठाउँ जनाउँछन्; こちら/そちら/あちら तिनकै आदरार्थी रूप हुन् र दिशा पनि जनाउन सक्छन्।", "examples": [{"japanese": "トイレは あちらです。", "romaji": "Toire wa achira desu.", "english": "The restroom is that way.", "nepali": "शौचालय उता छ।"}]}, {"lesson": "Lesson 3", "grammar_point": "N は Place です。", "form": "N は Place です。", "english_explanation": "States the location of a person, place, or object.", "nepali_explanation": "कुनै व्यक्ती, ठाउँ वा वस्तु कहाँ अवस्थित छ भनेर बताउने वाक्य।", "examples": [{"japanese": "かばんは つくえの うえです。", "romaji": "Kaban wa tsukue no ue desu.", "english": "The bag is on the desk.", "nepali": "झोला डेस्कमाथि छ।"}]}, {"lesson": "Lesson 3", "grammar_point": "N₁ の N₂ (Origin of a product)", "form": "N₁ の N₂", "english_explanation": "When N1 is a country or company, N2 の N1 shows which country or company produced it. どこの asks 'from where'.", "nepali_explanation": "N1 देश वा कम्पनी भएमा, यसले N2 कुन देश वा कम्पनीको उत्पादन हो भनेर देखाउँछ। どこの ले 'कहाँको' भनेर सोध्छ।", "examples": [{"japanese": "それは どこの かばんですか。 かんこくの かばんです。", "romaji": "Sore wa doko no kaban desu ka. Kankoku no kaban desu.", "english": "Where is that bag from? It's a Korean bag.", "nepali": "त्यो झोला कहाँको हो? दक्षिण कोरियाको झोला हो।"}]}, {"lesson": "Lesson 3", "grammar_point": "こ/そ/あ/ど System", "form": "これ/この/ここ/こちら etc.", "english_explanation": "All Japanese demonstratives follow the same four-way pattern based on distance from the speaker/listener, whether pointing at things, people, places, or directions.", "nepali_explanation": "जापानी भाषाका सबै प्रदर्शक शब्दहरूले वक्ता/श्रोताबाटको दूरीमा आधारित एउटै चार-तहको ढाँचा पछ्याउँछन्, चाहे वस्तु, व्यक्ती, ठाउँ वा दिशा जनाइरहेको होस्।", "examples": [{"japanese": "place: ここ／そこ／あそこ／どこ", "romaji": "koko/soko/asoko/doko", "english": "here/there/over there/where", "nepali": "यहाँ/त्यहाँ/उ त्यहाँ/कहाँ"}]}, {"lesson": "Lesson 4", "grammar_point": "Telling Time", "form": "いま ―じ ―ふん です。", "english_explanation": "Used to state the current clock time; なんじ asks what time it is.", "nepali_explanation": "अहिलेको घडीको समय बताउन प्रयोग हुन्छ; なんじ ले कति बज्यो भनेर सोध्छ।", "examples": [{"japanese": "いま はちじ はんです。", "romaji": "Ima hachiji han desu.", "english": "It is 8:30 now.", "nepali": "अहिले साढे आठ बज्यो।"}]}, {"lesson": "Lesson 4", "grammar_point": "Two Tenses in Japanese", "form": "Non-past / Past", "english_explanation": "Japanese grammar only distinguishes two tenses — Non-past (covers both present and future) and Past — there is no separate future-tense verb form.", "nepali_explanation": "जापानी व्याकरणमा काल दुईवटा मात्र छन् — Non-past (वर्तमान र भविष्य दुबै समेट्ने) र Past। भविष्यकालको लागि छुट्टै क्रियारूप हुँदैन।", "examples": [{"japanese": "らいねん にほんへ いきます。", "romaji": "Rainen Nihon e ikimasu.", "english": "Next year I will go to Japan.", "nepali": "अर्को वर्ष जापान जान्छु।"}]}, {"lesson": "Lesson 4", "grammar_point": "ます-form (Polite Verb Form)", "form": "V…ます", "english_explanation": "This is the standard polite conjugation used in everyday conversation and is the form most beginners memorize first.", "nepali_explanation": "यो दैनिक नम्र कुराकानीमा प्रयोग हुने मानक रूप हो र सुरुवाती विद्यार्थीले सबैभन्दा पहिले सम्झने रूप हो।", "examples": [{"japanese": "のみます (drink)", "romaji": "nomimasu", "english": "drink", "nepali": "पिउँछु"}]}, {"lesson": "Lesson 4", "grammar_point": "Four Basic Conjugations", "form": "+ve/-ve, Present/Past", "english_explanation": "Every polite verb has four core forms combining tense and polarity: affirmative present, negative present, affirmative past, negative past.", "nepali_explanation": "जुनसुकै नम्र क्रियापदको चार आधारभूत रूप हुन्छन्: वर्तमान सकारात्मक, वर्तमान नकारात्मक, भूत सकारात्मक, भूत नकारात्मक।", "examples": [{"japanese": "のみます／のみません／のみました／のみませんでした", "romaji": "nomimasu/nomimasen/nomimashita/nomimasendeshita", "english": "drink/don't drink/drank/didn't drink", "nepali": "पिउँछु/पिउँदिन/पिएँ/पिइन"}]}, {"lesson": "Lesson 4", "grammar_point": "Time Marker N(time)に Verb", "form": "N(time)に Verb", "english_explanation": "に marks the exact clock time an action occurs, but only when that time is stated as a number; days of the week may optionally take に as well.", "nepali_explanation": "に ले कुनै कार्य हुने ठ्याक्कै समय संकेत गर्छ, तर त्यो समय अंकमा उल्लेख गरिएको हुनुपर्छ; वारको हकमा に वैकल्पिक हुन्छ।", "examples": [{"japanese": "まいばん じゅういちじに ねます。", "romaji": "Maiban jūichiji ni nemasu.", "english": "I go to bed at 11 every night.", "nepali": "म हरेक रात ११ बजे सुत्छु।"}]}, {"lesson": "Lesson 4", "grammar_point": "N₁ から N₂ まで (from ~ to ~)", "form": "N₁から N₂まで", "english_explanation": "から marks a starting point (time or place); まで marks an ending point. They may be used together or separately.", "nepali_explanation": "から ले सुरुबिन्दु (समय वा ठाउँ) र まで ले अन्त्यबिन्दु जनाउँछ। दुबै एकैसाथ वा छुट्टाछुट्टै प्रयोग गर्न सकिन्छ।", "examples": [{"japanese": "げつようびから きんようびまで はたらきます。", "romaji": "Getsuyōbi kara kin'yōbi made hatarakimasu.", "english": "I work from Monday to Friday.", "nepali": "सोमबारदेखि शुक्रबारसम्म काम गर्छु।"}]}, {"lesson": "Lesson 4", "grammar_point": "N₁ と N₂ (~ and ~)", "form": "N₁ と N₂", "english_explanation": "Connects two nouns or pronouns with the meaning 'and'.", "nepali_explanation": "दुई नाम वा सर्वनामलाई 'र' भन्ने अर्थमा जोड्छ।", "examples": [{"japanese": "コーヒーと こうちゃが すきです。", "romaji": "Kōhī to kōcha ga suki desu.", "english": "I like coffee and black tea.", "nepali": "मलाई कफी र कालो चिया मन पर्छ।"}]}, {"lesson": "Lesson 5", "grammar_point": "Direction Particle へ", "form": "N(place)へ Verb", "english_explanation": "へ (pronounced 'e') marks the direction of movement — heading toward a place — and always attaches directly to a place word.", "nepali_explanation": "へ (उच्चारण 'ए') ले कुनै ठाउँतिर हिँडेको दिशा जनाउँछ र सधैं स्थानसूचक शब्दको ठीक पछाडि लाग्छ।", "examples": [{"japanese": "らいしゅう おおさかへ いきます。", "romaji": "Raishū Ōsaka e ikimasu.", "english": "Next week I'll go to Osaka.", "nepali": "अर्को हप्ता ओसाका जान्छु।"}]}, {"lesson": "Lesson 5", "grammar_point": "どこ[へ]も + Negative", "form": "どこへも Verb(negative)", "english_explanation": "When どこ is followed by も, the sentence must end in a negative verb, giving the meaning 'nowhere/not anywhere'.", "nepali_explanation": "どこ पछि も आएमा वाक्य सधैं नकारात्मक क्रियापदमा टुंगिन्छ, जसको अर्थ 'कतैपनि छैन' हुन्छ।", "examples": [{"japanese": "こんしゅう どこへも いきません。", "romaji": "Konshū doko e mo ikimasen.", "english": "I'm not going anywhere this week.", "nepali": "म यो हप्ता कतैपनि जाँदिन।"}]}, {"lesson": "Lesson 5", "grammar_point": "Means of Transport N(vehicle)で", "form": "N(vehicle)で Verb", "english_explanation": "で marks the vehicle used to travel — 'by (means of)'.", "nepali_explanation": "で ले यात्रा गर्न प्रयोग गरिएको सवारी-साधन जनाउँछ — 'ले/मार्फत'।", "examples": [{"japanese": "じてんしゃで きました。", "romaji": "Jitensha de kimashita.", "english": "I came by bicycle.", "nepali": "म साइकलमा आएँ।"}]}, {"lesson": "Lesson 5", "grammar_point": "Companion Particle N(person)と", "form": "N(person/animal)と Verb", "english_explanation": "と marks the person or animal accompanying the action — 'together with'.", "nepali_explanation": "と ले कार्यमा साथ दिने व्यक्ती वा प्राणी जनाउँछ — 'सँगै'।", "examples": [{"japanese": "ともだちと えいがを みました。", "romaji": "Tomodachi to eiga o mimashita.", "english": "I watched a movie with a friend.", "nepali": "साथीसँग चलचित्र हेरें।"}]}, {"lesson": "Lesson 5", "grammar_point": "Asking いつ (When)", "form": "いつ Verb か。", "english_explanation": "Used to ask when an action does or did take place.", "nepali_explanation": "कुनै कार्य कहिले हुन्छ वा भयो भनेर सोध्न प्रयोग गरिन्छ।", "examples": [{"japanese": "いつ にほんへ かえりますか。", "romaji": "Itsu Nihon e kaerimasu ka.", "english": "When will you return to Japan?", "nepali": "कहिले जापान फर्कनुहुन्छ?"}]}, {"lesson": "Lesson 5", "grammar_point": "Sentence-final よ", "form": "Sentence + よ", "english_explanation": "Added at the end of a sentence to give the listener new information or to assert the speaker's opinion firmly.", "nepali_explanation": "वाक्यको अन्त्यमा राखेर श्रोतालाई नयाँ जानकारी दिन वा वक्ताको धारणालाई जोड दिन प्रयोग गरिन्छ।", "examples": [{"japanese": "その みせは もう しまっていますよ。", "romaji": "Sono mise wa mō shimatte imasu yo.", "english": "That shop is already closed, you know.", "nepali": "त्यो पसल अघिनै बन्द भइसक्यो नि।"}]}, {"lesson": "Lesson 6", "grammar_point": "Object Marker を", "form": "N を Verb", "english_explanation": "を marks the direct object of a transitive verb — the thing that directly receives the action.", "nepali_explanation": "を ले सकर्मक क्रियाले सिधै असर पार्ने वस्तु (कर्म) लाई संकेत गर्छ।", "examples": [{"japanese": "まいあさ しんぶんを よみます。", "romaji": "Maiasa shinbun o yomimasu.", "english": "I read the newspaper every morning.", "nepali": "म हरेक बिहान अखबार पढ्छु।"}]}, {"lesson": "Lesson 6", "grammar_point": "N を します (do/play)", "form": "N を します", "english_explanation": "します combines with many activity nouns to mean 'do' or 'play' that activity.", "nepali_explanation": "します धेरै क्रियाकलाप-नामसँग जोडिएर 'गर्छु/खेल्छु' भन्ने अर्थ दिन्छ।", "examples": [{"japanese": "バスケットボールを します。", "romaji": "Basukettobōru o shimasu.", "english": "I play basketball.", "nepali": "म बास्केटबल खेल्छु।"}]}, {"lesson": "Lesson 6", "grammar_point": "なにを しますか。", "form": "なにを しますか。", "english_explanation": "Asks what someone will do or is doing.", "nepali_explanation": "कसैले के गर्नुहुन्छ भनेर सोध्ने प्रश्न।", "examples": [{"japanese": "しゅうまつ なにを しますか。 かいものを します。", "romaji": "Shūmatsu nani o shimasu ka. Kaimono o shimasu.", "english": "What will you do this weekend? I'll go shopping.", "nepali": "हप्ताको अन्त्यमा के गर्नुहुन्छ? किनमेल गर्छु।"}]}, {"lesson": "Lesson 6", "grammar_point": "なん vs なに", "form": "なん／なに", "english_explanation": "なん is used before た/だ/な-row sounds, before counters, and when asking about a day; なに is used everywhere else.", "nepali_explanation": "なん ले た/だ/な-row अक्षर अगाडि, काउन्टर अगाडि, र वार सोध्दा प्रयोग हुन्छ; बाँकी सबैतिर なに प्रयोग हुन्छ।", "examples": [{"japanese": "それは なんですか。", "romaji": "Sore wa nan desu ka.", "english": "What is that?", "nepali": "त्यो के हो?"}]}, {"lesson": "Lesson 6", "grammar_point": "Location of Action N(place)で", "form": "N(place)で Verb", "english_explanation": "で marks the place where an action is carried out — 'at/in'.", "nepali_explanation": "で ले कुनै कार्य भइरहेको ठाउँ जनाउँछ — 'मा'।", "examples": [{"japanese": "としょかんで べんきょうします。", "romaji": "Toshokan de benkyō shimasu.", "english": "I study at the library.", "nepali": "म पुस्तकालयमा अध्ययन गर्छु।"}]}, {"lesson": "Lesson 6", "grammar_point": "V ましょう (Let's ~)", "form": "V ましょう", "english_explanation": "Proposes doing something together; formed by replacing ます with ましょう.", "nepali_explanation": "सँगै केही गरौं भनेर प्रस्ताव गर्छ; ます लाई ましょう ले बदलेर बनाइन्छ।", "examples": [{"japanese": "いっしょに あるきましょう。", "romaji": "Issho ni arukimashō.", "english": "Let's walk together.", "nepali": "सँगै हिँडौं।"}]}, {"lesson": "Lesson 6", "grammar_point": "V ませんか (Won't you ~?)", "form": "V ませんか", "english_explanation": "A soft invitation to do something together.", "nepali_explanation": "सँगै केही गर्न नरम रूपमा दिइने आमन्त्रण।", "examples": [{"japanese": "いっしょに おちゃを のみませんか。", "romaji": "Issho ni ocha o nomimasen ka.", "english": "Won't you have tea with me?", "nepali": "सँगै चिया पिउने हैन?"}]}, {"lesson": "Lesson 7", "grammar_point": "Means/Tool Particle で", "form": "N(tool/means)で Verb", "english_explanation": "で marks the tool or method used to perform an action — 'by means of'.", "nepali_explanation": "で ले कुनै कार्य गर्न प्रयोग भएको उपकरण वा तरिका जनाउँछ — 'ले/द्वारा'।", "examples": [{"japanese": "ボールペンで かきます。", "romaji": "Bōrupen de kakimasu.", "english": "I write with a ballpoint pen.", "nepali": "म बलपेनले लेख्छु।"}]}, {"lesson": "Lesson 7", "grammar_point": "Asking a Word's Translation", "form": "N は ～語(ご)で なんですか。", "english_explanation": "Used to ask what a word or phrase is in another language.", "nepali_explanation": "कुनै शब्द अर्को भाषामा के हो भनेर सोध्न प्रयोग गरिन्छ।", "examples": [{"japanese": "「Book」は にほんごで なんですか。 「ほん」です。", "romaji": "'Book' wa nihongo de nan desu ka. 'Hon' desu.", "english": "What is 'Book' in Japanese? It's 'hon'.", "nepali": "'Book' जापानी भाषामा के हो? 'होन' हो।"}]}, {"lesson": "Lesson 7", "grammar_point": "Giving/Teaching に", "form": "N₁(person)に N₂を あげます／かします／おしえます。", "english_explanation": "に marks the recipient of an act of giving, lending, or teaching — 'to'.", "nepali_explanation": "に ले दिने, उधारो दिने वा सिकाउने कार्यको प्राप्तकर्ता जनाउँछ — 'लाई'।", "examples": [{"japanese": "こどもに チョコレートを あげました。", "romaji": "Kodomo ni chokorēto o agemashita.", "english": "I gave chocolate to the child.", "nepali": "बच्चालाई चकलेट दिएँ।"}]}, {"lesson": "Lesson 7", "grammar_point": "Receiving/Learning に／から", "form": "N₁(person)に N₂を もらいます／かります／ならいます。", "english_explanation": "に or から marks the source from whom something is received, borrowed, or learned — 'from'. When it's an organization or company, only から is used.", "nepali_explanation": "に वा から ले पाउने, उधारो लिने वा सिक्ने कार्यको स्रोत जनाउँछ — 'बाट'। संस्था वा कम्पनीको हकमा केवल から मात्र प्रयोग गरिन्छ।", "examples": [{"japanese": "としょかんから ほんを かりました。", "romaji": "Toshokan kara hon o karimashita.", "english": "I borrowed a book from the library.", "nepali": "पुस्तकालयबाट किताब उधारो लिएँ।"}]}, {"lesson": "Lesson 7", "grammar_point": "もう V ました (already done)", "form": "もう V ました", "english_explanation": "もう means 'already'; used with the past tense to show an action is already finished.", "nepali_explanation": "もう को अर्थ 'अघिनै' हो; भूतकालसँग प्रयोग गरी कार्य पहिले नै सकिएको जनाउँछ।", "examples": [{"japanese": "もう しゅくだいを しましたか。 はい、もう しました。", "romaji": "Mō shukudai o shimashita ka. Hai, mō shimashita.", "english": "Have you already done your homework? Yes, already done.", "nepali": "गृहकार्य अघिनै गर्नुभयो? हजुर, अघिनै गरिसकें।"}]}, {"lesson": "Lesson 8", "grammar_point": "Two Adjective Types", "form": "な-adjective ／ い-adjective", "english_explanation": "Japanese adjectives fall into two grammatical groups depending on their ending: な-adjectives and い-adjectives, each conjugating differently.", "nepali_explanation": "जापानी विशेषणहरू आफ्नो अन्त्यअनुसार दुई व्याकरणिक समूहमा पर्छन्: な-adjective र い-adjective, दुबैको रूपान्तरण फरक हुन्छ।", "examples": [{"japanese": "にぎやか[な] (lively) / さむい (cold)", "romaji": "nigiyaka / samui", "english": "lively / cold", "nepali": "चहलपहल भएको / जाडो"}]}, {"lesson": "Lesson 8", "grammar_point": "な-adjective + です／+ Noun", "form": "な-adj です。／な-adj[な] Noun です。", "english_explanation": "Drop な before です, but keep な before a following noun.", "nepali_explanation": "です अगाडि な हटाइन्छ, तर पछि नाम आउँदा な राखिन्छ।", "examples": [{"japanese": "この まちは にぎやかです。", "romaji": "Kono machi wa nigiyaka desu.", "english": "This town is lively.", "nepali": "यो शहर चहलपहल भएको छ।"}, {"japanese": "にぎやかな まちです。", "romaji": "Nigiyaka na machi desu.", "english": "It's a lively town.", "nepali": "चहलपहल भएको शहर हो।"}]}, {"lesson": "Lesson 8", "grammar_point": "い-adjective + です／+ Noun", "form": "い-adj です。／い-adj Noun です。", "english_explanation": "い-adjectives stay unchanged whether followed by です or a noun.", "nepali_explanation": "い-adjective मा です वा नाम जुनसुकै आए पनि केही फेरबदल हुँदैन।", "examples": [{"japanese": "さむい ひです。", "romaji": "Samui hi desu.", "english": "It's a cold day.", "nepali": "जाडो दिन हो।"}]}, {"lesson": "Lesson 8", "grammar_point": "Non-past Negative Adjectives", "form": "な-adj:じゃありません／い-adj:くない", "english_explanation": "な-adjectives drop です and add じゃ ありません; い-adjectives drop the final い and add くない. Exception: いい becomes よくない.", "nepali_explanation": "な-adjective मा です हटाई じゃ ありません थपिन्छ; い-adjective मा अन्तिम い हटाई くない थपिन्छ। अपवाद: いい को negative form よくない हुन्छ।", "examples": [{"japanese": "きょうは さむくないです。", "romaji": "Kyō wa samukunai desu.", "english": "It's not cold today.", "nepali": "आज जाडो छैन।"}]}, {"lesson": "Lesson 8", "grammar_point": "Contrastive S₁が、S₂", "form": "S₁が、S₂。", "english_explanation": "が connects two clauses with contrasting qualities, meaning 'but'.", "nepali_explanation": "が ले विपरीत गुण भएका दुई वाक्यांशलाई जोड्छ, अर्थ 'तर'।", "examples": [{"japanese": "この へやは せまいですが、あかるいです。", "romaji": "Kono heya wa semai desu ga, akarui desu.", "english": "This room is small, but bright.", "nepali": "यो कोठा साँघुरो छ तर उज्यालो छ।"}]}, {"lesson": "Lesson 8", "grammar_point": "Additive S₁。そして S₂。", "form": "S₁。そして S₂。", "english_explanation": "そして connects two clauses with qualities in the same direction, meaning 'and'.", "nepali_explanation": "そして ले उही दिशाको गुण भएका दुई वाक्यांशलाई जोड्छ, अर्थ 'र'।", "examples": [{"japanese": "この レストランは やすいです。そして おいしいです。", "romaji": "Kono resutoran wa yasui desu. Soshite oishii desu.", "english": "This restaurant is cheap, and it's delicious.", "nepali": "यो रेस्टुरेन्ट सस्तो छ र मीठो छ।"}]}, {"lesson": "Lesson 8", "grammar_point": "とても／あまり (very / not so)", "form": "とても+adj(+ve)／あまり+adj(-ve)", "english_explanation": "とても intensifies an affirmative sentence; あまり softens a negative sentence to mean 'not so'.", "nepali_explanation": "とても ले सकारात्मक वाक्यलाई जोड दिन्छ; あまり ले नकारात्मक वाक्यलाई 'खासै' भन्ने अर्थमा नरम बनाउँछ।", "examples": [{"japanese": "あの えいがは あまり おもしろくないです。", "romaji": "Ano eiga wa amari omoshirokunai desu.", "english": "That movie isn't very interesting.", "nepali": "त्यो चलचित्र खासै रोचक छैन।"}]}, {"lesson": "Lesson 8", "grammar_point": "N は どうですか。 (How is N?)", "form": "N は どうですか。", "english_explanation": "Asks for the listener's impression or opinion about a place, person, or thing.", "nepali_explanation": "कुनै ठाउँ, व्यक्ती वा वस्तुको बारेमा श्रोताको धारणा सोध्ने प्रश्न।", "examples": [{"japanese": "あたらしい しごとは どうですか。", "romaji": "Atarashii shigoto wa dō desu ka.", "english": "How is the new job?", "nepali": "नयाँ काम कस्तो छ?"}]}, {"lesson": "Lesson 8", "grammar_point": "N₁ は どんな N₂ ですか。", "form": "N₁は どんな N₂ですか。", "english_explanation": "Asks what kind or category N1 falls into within N2. どんな is always followed directly by a noun.", "nepali_explanation": "N1 कस्तो प्रकारको N2 हो भनेर सोध्ने प्रश्न। どんな पछि सधैं नाम आउँछ।", "examples": [{"japanese": "しゃちょうは どんな ひとですか。", "romaji": "Shachō wa donna hito desu ka.", "english": "What kind of person is the company president?", "nepali": "कम्पनी अध्यक्ष कस्तो प्रकारको मान्छे हो?"}]}, {"lesson": "Lesson 9", "grammar_point": "が with Certain Verbs/Adjectives", "form": "N が あります／わかります／すきです etc.", "english_explanation": "Unlike ordinary transitive verbs which take を, verbs like あります (have) and わかります (understand), plus adjectives like すき (like), きらい (dislike), じょうず (good at), へた (poor at), all take が to mark their object.", "nepali_explanation": "सामान्य सकर्मक क्रियाले を लिने भए तापनि, あります र わかります जस्ता क्रिया, र すき、きらい、じょうず、へた जस्ता विशेषणले भने आफ्नो कर्मलाई が द्वारा संकेत गराउँछन्।", "examples": [{"japanese": "わたしは えいごが わかります。", "romaji": "Watashi wa eigo ga wakarimasu.", "english": "I understand English.", "nepali": "म अंग्रेजी बुझ्छु।"}]}, {"lesson": "Lesson 9", "grammar_point": "どんな N (asking which category item)", "form": "どんな N が すきですか。", "english_explanation": "Asks the listener to name a specific item within a given category.", "nepali_explanation": "दिइएको वर्गभित्रको कुनै खास वस्तु नामोल्लेख गर्न श्रोतालाई सोध्ने प्रश्न।", "examples": [{"japanese": "どんな おんがくが すきですか。", "romaji": "Donna ongaku ga suki desu ka.", "english": "What kind of music do you like?", "nepali": "कस्तो प्रकारको संगीत मन पर्छ?"}]}, {"lesson": "Lesson 9", "grammar_point": "Degree Adverbs", "form": "よく／だいたい／たくさん／すこし／あまり／ぜんぜん", "english_explanation": "These adverbs modify a following verb to indicate degree or amount; あまり and ぜんぜん require a negative verb.", "nepali_explanation": "यी क्रियाविशेषणले पछि आउने क्रियापदलाई मात्रा वा डिग्री जनाउन परिमार्जन गर्छन्; あまり र ぜんぜん सँग नकारात्मक क्रियापद नै चाहिन्छ।", "examples": [{"japanese": "かんじが ぜんぜん わかりません。", "romaji": "Kanji ga zenzen wakarimasen.", "english": "I don't understand kanji at all.", "nepali": "खान्जी पटक्कै बुझ्दिन।"}]}, {"lesson": "Lesson 9", "grammar_point": "Reason S₁から、S₂", "form": "S₁から、S₂。", "english_explanation": "から states a reason; S1 gives the cause for S2.", "nepali_explanation": "から ले कारण बताउँछ; S1 चाँही S2 को कारण हुन्छ।", "examples": [{"japanese": "あめですから、うちに います。", "romaji": "Ame desu kara, uchi ni imasu.", "english": "Because it's raining, I'm staying home.", "nepali": "पानी परेकोले घरमै छु।"}]}, {"lesson": "Lesson 9", "grammar_point": "Asking どうして (Why)", "form": "どうして Verb か。", "english_explanation": "Asks the reason for an action; the answer always ends in から.", "nepali_explanation": "कुनै कार्यको कारण सोध्ने प्रश्न; उत्तर सधैं から ले टुंगिन्छ।", "examples": [{"japanese": "どうして おそく きましたか。 でんしゃが おくれましたから。", "romaji": "Dōshite osoku kimashita ka. Densha ga okuremashita kara.", "english": "Why did you come late? Because the train was delayed.", "nepali": "किन ढिलो आउनुभयो? रेल ढिलो भएकोले।"}]}, {"lesson": "Lesson 10", "grammar_point": "Existence: あります／います", "form": "N が あります(inanimate)／います(animate)", "english_explanation": "あります is for things that cannot move on their own; います is for people and animals that can.", "nepali_explanation": "あります आफैं चल्न नसक्ने वस्तुका लागि हो; います आफैं चल्न सक्ने मानिस र जनावरका लागि हो।", "examples": [{"japanese": "にわに きが あります。", "romaji": "Niwa ni ki ga arimasu.", "english": "There is a tree in the garden.", "nepali": "बगैंचामा रुख छ।"}]}, {"lesson": "Lesson 10", "grammar_point": "Place に N が あります／います", "form": "Place に N が Verb", "english_explanation": "に marks the location where something exists.", "nepali_explanation": "に ले वस्तु अवस्थित भएको ठाउँ जनाउँछ।", "examples": [{"japanese": "こうえんに こどもが います。", "romaji": "Kōen ni kodomo ga imasu.", "english": "There is a child in the park.", "nepali": "पार्कमा बच्चा छ।"}]}, {"lesson": "Lesson 10", "grammar_point": "N は Place に あります／います", "form": "N は Place に Verb", "english_explanation": "Restructures the sentence so the item, rather than the place, becomes the topic.", "nepali_explanation": "वाक्यलाई पुनर्संरचना गरी ठाउँको सट्टा वस्तुलाई मुख्य विषय बनाइन्छ।", "examples": [{"japanese": "こどもは こうえんに います。", "romaji": "Kodomo wa kōen ni imasu.", "english": "The child is in the park.", "nepali": "बच्चा पार्कमा छ।"}]}, {"lesson": "Lesson 10", "grammar_point": "Position Nouns with の", "form": "N₁の うえ／した／まえ etc.", "english_explanation": "Position words like うえ (above), した (below), まえ (front), うしろ (behind) act as nouns and connect to a reference point with の.", "nepali_explanation": "उए (माथि), した (तल), まえ (अगाडि), うしろ (पछाडि) जस्ता स्थितिसूचक शब्दहरू नामको रूपमा काम गर्छन् र の ले सन्दर्भ बिन्दुसँग जोडिन्छन्।", "examples": [{"japanese": "いすの したに ねこが います。", "romaji": "Isu no shita ni neko ga imasu.", "english": "There is a cat under the chair.", "nepali": "कुर्सीमुनि बिरालो छ।"}]}, {"lesson": "Lesson 10", "grammar_point": "N₁ や N₂ [など] (partial listing)", "form": "N₁ や N₂ など", "english_explanation": "や lists a few representative items without implying an exhaustive list; など can be added to explicitly show 'and other similar things'.", "nepali_explanation": "や ले पूर्ण सूची नभई केही प्रतिनिधि वस्तुहरू मात्र सूचीबद्ध गर्छ; など थपेर 'र त्यस्तै अरू' भन्ने अर्थ स्पष्ट पार्न सकिन्छ।", "examples": [{"japanese": "つくえに ノートや ペンが あります。", "romaji": "Tsukue ni nōto ya pen ga arimasu.", "english": "There is a notebook, a pen, and such on the desk.", "nepali": "डेस्कमा नोटबुक, कलम आदि छ।"}]}, {"lesson": "Lesson 10", "grammar_point": "Confirming a Word: Word ですか。", "form": "N ですか。", "english_explanation": "Repeats back a word someone said, as a way to confirm understanding.", "nepali_explanation": "कसैले भनेको शब्द दोहोर्याएर बुझेको पुष्टि गर्ने तरिका।", "examples": [{"japanese": "としょかんですか。あの ビルの なかです。", "romaji": "Toshokan desu ka. Ano biru no naka desu.", "english": "The library? It's inside that building.", "nepali": "पुस्तकालय? त्यो भवनभित्र छ।"}]}, {"lesson": "Lesson 11", "grammar_point": "Number/Counter Systems", "form": "いくつ／なんにん／なんまい／なんだい", "english_explanation": "Japanese uses different counting words for different object types: miscellaneous objects (いくつ), people (なんにん), flat thin objects like paper (なんまい), and machines/vehicles (なんだい).", "nepali_explanation": "जापानी भाषामा फरक-फरक वस्तुका लागि फरक-फरक गन्तीका शब्द प्रयोग गरिन्छ: विविध वस्तु (いくつ), मानिस (なんにん), कागज जस्ता पातलो-फराकिलो वस्तु (なんまい), र मेशिन/सवारी-साधन (なんだい)।", "examples": [{"japanese": "ケーキが よっつ あります。", "romaji": "Kēki ga yottsu arimasu.", "english": "There are 4 cakes.", "nepali": "केक ४ वटा छ।"}]}, {"lesson": "Lesson 11", "grammar_point": "Frequency: Quantifier(period)に ―かい Verb", "form": "Quantifier に ―かい Verb", "english_explanation": "States how many times an action happens within a given period.", "nepali_explanation": "कुनै समय अवधिभित्र कुनै कार्य कति पटक हुन्छ भनेर बताउँछ।", "examples": [{"japanese": "いっしゅうかんに にかい ジムへ いきます。", "romaji": "Isshūkan ni nikai jimu e ikimasu.", "english": "I go to the gym twice a week.", "nepali": "हप्तामा दुई पटक जिम जान्छु।"}]}, {"lesson": "Lesson 11", "grammar_point": "Limiting Particle だけ (only)", "form": "Quantifier だけ／Noun だけ", "english_explanation": "だけ means 'only/just' and can attach to a quantity/time expression or directly to a noun.", "nepali_explanation": "だけ को अर्थ 'मात्र' हो र यो मात्रा/समयको वाक्यांश वा सिधै नामसँग जोडिन्छ।", "examples": [{"japanese": "にほんごが すこしだけ わかります。", "romaji": "Nihongo ga sukoshi dake wakarimasu.", "english": "I only understand a little Japanese.", "nepali": "जापानी भाषा अलिकति मात्र बुझ्छु।"}]}, {"lesson": "Lesson 12", "grammar_point": "Past Tense of Noun/な-adjective Sentences", "form": "でした／じゃありませんでした", "english_explanation": "です becomes でした (past affirmative); じゃ ありません becomes じゃ ありませんでした (past negative).", "nepali_explanation": "です को भूतकालीन सकारात्मक रूप でした हुन्छ; じゃ ありません को भूतकालीन नकारात्मक रूप じゃ ありませんでした हुन्छ।", "examples": [{"japanese": "きのうは やすみでした。", "romaji": "Kinō wa yasumi deshita.", "english": "Yesterday was a day off.", "nepali": "हिजो बिदा थियो।"}]}, {"lesson": "Lesson 12", "grammar_point": "Past Tense of い-adjective Sentences", "form": "かった／くなかった", "english_explanation": "Drop the final い and add かった for past affirmative, or くなかった for past negative.", "nepali_explanation": "अन्तिम い हटाई かった (भूत सकारात्मक) वा くなかった (भूत नकारात्मक) थपिन्छ।", "examples": [{"japanese": "えいがは おもしろかったです。", "romaji": "Eiga wa omoshirokatta desu.", "english": "The movie was interesting.", "nepali": "चलचित्र रोचक थियो।"}]}, {"lesson": "Lesson 12", "grammar_point": "Comparison N₁ は N₂ より Adj です。", "form": "N₁は N₂より Adj です。", "english_explanation": "より means 'than', comparing two things.", "nepali_explanation": "より को अर्थ 'भन्दा' हो, दुई वस्तुबीच तुलना गर्छ।", "examples": [{"japanese": "ひこうきは ふねより はやいです。", "romaji": "Hikōki wa fune yori hayai desu.", "english": "A plane is faster than a ship.", "nepali": "हवाईजहाज जहाजभन्दा छिटो हुन्छ।"}]}, {"lesson": "Lesson 12", "grammar_point": "Which of Two: どちらが Adj ですか。", "form": "… N の ほうが Adj です。", "english_explanation": "Asks which of two options has more of a quality; answer names the one with の ほう.", "nepali_explanation": "दुई विकल्पमध्ये कुन बढी हो भनेर सोध्छ; उत्तरमा の ほう प्रयोग गरिन्छ।", "examples": [{"japanese": "なつと ふゆと どちらが すきですか。 なつの ほうが すきです。", "romaji": "Natsu to fuyu to dochira ga suki desu ka. Natsu no hō ga suki desu.", "english": "Which do you like better, summer or winter? I like summer better.", "nepali": "गर्मी र जाडो कुन मन पर्छ? गर्मी नै मन पर्छ।"}]}, {"lesson": "Lesson 12", "grammar_point": "Superlative いちばん", "form": "N が いちばん Adj です。", "english_explanation": "Asks or states which item is 'the most ~' within a group.", "nepali_explanation": "समूहभित्र कुन वस्तु 'सबैभन्दा ~' हो भनेर सोध्ने वा बताउने संरचना।", "examples": [{"japanese": "かぞくで だれが いちばん せが たかいですか。", "romaji": "Kazoku de dare ga ichiban se ga takai desu ka.", "english": "Who is the tallest in your family?", "nepali": "परिवारमा सबैभन्दा अग्लो को हो?"}]}, {"lesson": "Lesson 13", "grammar_point": "Wanting a Thing: N が ほしいです。", "form": "N が ほしいです。", "english_explanation": "ほしい means 'want (a thing)'. The desired item is marked with が, and ほしい conjugates like an い-adjective.", "nepali_explanation": "ほしい को अर्थ 'चाहन्छु' हो। चाहेको वस्तुलाई が ले संकेत गरिन्छ, र ほしい लाई い-adjective झैं रूपान्तरण गरिन्छ।", "examples": [{"japanese": "あたらしい くつが ほしいです。", "romaji": "Atarashii kutsu ga hoshii desu.", "english": "I want new shoes.", "nepali": "मलाई नयाँ जुत्ता चाहिन्छ।"}]}, {"lesson": "Lesson 13", "grammar_point": "Wanting to Do: V(stem)たいです。", "form": "V(ます-stem)たいです。", "english_explanation": "Drop ます and add たい to say 'want to (do)'. Like ほしい, it conjugates as an い-adjective; the object may optionally be marked with が instead of を.", "nepali_explanation": "ます हटाई たい थपेर 'गर्न चाहन्छु' भन्ने अर्थ दिन्छ। ほしい जस्तै यसलाई पनि い-adjective झैं रूपान्तरण गरिन्छ; कर्मलाई を को साटो が ले पनि संकेत गर्न सकिन्छ।", "examples": [{"japanese": "うみへ およぎに いきたいです。", "romaji": "Umi e oyogi ni ikitai desu.", "english": "I want to go swimming at the sea.", "nepali": "समुद्रमा पौडी खेल्न जान चाहन्छु।"}]}, {"lesson": "Lesson 13", "grammar_point": "Purpose of Movement に", "form": "N(place)へ V(stem)／Noun に いきます／きます／かえります", "english_explanation": "に marks the purpose of going, coming, or returning somewhere — 'in order to'.", "nepali_explanation": "に ले कतैतिर जाने, आउने वा फर्कने कार्यको उद्देश्य जनाउँछ — 'को लागि'।", "examples": [{"japanese": "ぎんこうへ おかねを おろしに いきます。", "romaji": "Ginkō e okane o oroshi ni ikimasu.", "english": "I'm going to the bank to withdraw money.", "nepali": "बैंकमा पैसा निकाल्न जान्छु।"}]}, {"lesson": "Lesson 13", "grammar_point": "どこか／なにか (somewhere/something)", "form": "どこか[へ]／なにか[を]", "english_explanation": "どこ and なに can drop the particle (へ/を) that would normally follow them.", "nepali_explanation": "どこ र なに ले पछि आउने अव्यय (へ/を) लाई हटाउन सक्छन्।", "examples": [{"japanese": "なにか たべたいです。", "romaji": "Nanika tabetai desu.", "english": "I want to eat something.", "nepali": "केही खान चाहन्छु।"}]}, {"lesson": "Lesson 13", "grammar_point": "Honorific Prefix ご～", "form": "ご + Noun", "english_explanation": "ご is another respect-marking prefix, typically used before Sino-Japanese origin words (as opposed to お which pairs with native Japanese words).", "nepali_explanation": "ご अर्को सम्मानसूचक उपसर्ग हो, प्रायः चीनी-मूलका शब्दहरूसँग प्रयोग हुन्छ (जबकि お मूल जापानी शब्दहरूसँग जोडिन्छ)।", "examples": [{"japanese": "ごかぞく (family, polite)", "romaji": "go-kazoku", "english": "family", "nepali": "परिवार"}]}, {"lesson": "Lesson 14", "grammar_point": "Three Verb Groups", "form": "Group I／II／III", "english_explanation": "Verbs fall into three conjugation groups. Group I: い-sound before ます. Group II: え-sound before ます, with only one syllable preceding it. Group III: only きます and します (plus noun+します compounds).", "nepali_explanation": "क्रियापद तीन रूपान्तरण समूहमा पर्छन्। Group I: ます अघि い-sound। Group II: ます अघि え-sound, र त्यसअघि एउटा मात्र अक्षर। Group III: केवल きます र します।", "examples": [{"japanese": "Group I: よみます (read)", "romaji": "yomimasu", "english": "read", "nepali": "पढ्छु"}, {"japanese": "Group II: おきます (get up)", "romaji": "okimasu", "english": "get up", "nepali": "उठ्छु"}]}, {"lesson": "Lesson 14", "grammar_point": "て-form Conjugation", "form": "かいます→かって／たべます→たべて", "english_explanation": "The て-form is the base for continuous tense and many other patterns. Group I endings change variably (い/ち/り→って, に/び/み→んで, き→いて, ぎ→いで, し→して, with いく being irregular → いって). Group II simply drops ます and adds て. Group III: きて／して.", "nepali_explanation": "て-form लगातारकाल र अरू धेरै संरचनाको आधार हो। Group I को अन्त्य विभिन्न तरिकाले बदलिन्छ। Group II मा ます हटाई て मात्र थपिन्छ। Group III: きて／して।", "examples": [{"japanese": "よみます → よんで", "romaji": "yomimasu → yonde", "english": "read → (te-form)", "nepali": "पढ्छु → (ते-रूप)"}]}, {"lesson": "Lesson 14", "grammar_point": "て-form ください。 (Please)", "form": "V て-form ください。", "english_explanation": "Used to make a polite request or instruction.", "nepali_explanation": "नम्र अनुरोध वा निर्देशन गर्न प्रयोग गरिन्छ।", "examples": [{"japanese": "ここに なまえを かいて ください。", "romaji": "Koko ni namae o kaite kudasai.", "english": "Please write your name here.", "nepali": "यहाँ नाम लेख्नुहोस्।"}]}, {"lesson": "Lesson 14", "grammar_point": "て-form います。 (Ongoing action)", "form": "V て-form います。", "english_explanation": "Expresses an action currently in progress.", "nepali_explanation": "अहिले भइरहेको कार्य व्यक्त गर्छ।", "examples": [{"japanese": "いま りょうりを つくって います。", "romaji": "Ima ryōri o tsukutte imasu.", "english": "I am cooking right now.", "nepali": "म अहिले खाना बनाउँदैछु।"}]}, {"lesson": "Lesson 14", "grammar_point": "ましょうか। (Shall I ~?)", "form": "V ましょうか。", "english_explanation": "Offers to do something for someone.", "nepali_explanation": "कसैको लागि केही गरिदिने प्रस्ताव।", "examples": [{"japanese": "にもつを もちましょうか。", "romaji": "Nimotsu o mochimashō ka.", "english": "Shall I carry the luggage?", "nepali": "सामान बोकिदिऊँ कि?"}]}, {"lesson": "Lesson 14", "grammar_point": "Natural Phenomena with が", "form": "N(natural phenomenon)が Verb", "english_explanation": "When describing weather or other natural events, the phenomenon is marked with が.", "nepali_explanation": "मौसम वा अन्य प्राकृतिक घटना वर्णन गर्दा त्यसलाई が ले संकेत गरिन्छ।", "examples": [{"japanese": "かぜが ふいて います。", "romaji": "Kaze ga fuite imasu.", "english": "The wind is blowing.", "nepali": "हावा चलिरहेको छ।"}]}, {"lesson": "Lesson 14", "grammar_point": "すみませんが (Excuse me, but)", "form": "すみませんが、～", "english_explanation": "Softens a request by prefacing it politely.", "nepali_explanation": "अनुरोधलाई नरम बनाउन अगाडि प्रयोग गरिने वाक्यांश।", "examples": [{"japanese": "すみませんが、しゃしんを とって ください。", "romaji": "Sumimasen ga, shashin o totte kudasai.", "english": "Excuse me, but please take a photo.", "nepali": "माफ गर्नुहोस् तर, फोटो खिचिदिनुहोस्।"}]}, {"lesson": "Lesson 15", "grammar_point": "Asking Permission: てもいいですか。", "form": "V て-form も いいですか。", "english_explanation": "Asks permission to do something.", "nepali_explanation": "कुनै कार्य गर्न अनुमति माग्छ।", "examples": [{"japanese": "まどを あけても いいですか。", "romaji": "Mado o aketemo ii desu ka.", "english": "May I open the window?", "nepali": "झ्याल खोल्न सक्छु?"}]}, {"lesson": "Lesson 15", "grammar_point": "Granting Permission: てもいいです。", "form": "V て-form も いいです。", "english_explanation": "Grants permission for someone else to do something.", "nepali_explanation": "अरूलाई कुनै कार्य गर्ने अनुमति दिन्छ।", "examples": [{"japanese": "ここに すわっても いいです。", "romaji": "Koko ni suwattemo ii desu.", "english": "It's okay to sit here.", "nepali": "यहाँ बसे पनि हुन्छ।"}]}, {"lesson": "Lesson 15", "grammar_point": "Prohibition: てはいけません。", "form": "V て-form は いけません。", "english_explanation": "Expresses that an action must not be done.", "nepali_explanation": "कुनै कार्य गर्नु हुँदैन भन्ने निषेध व्यक्त गर्छ।", "examples": [{"japanese": "ここで しゃしんを とっては いけません。", "romaji": "Koko de shashin o tottewa ikemasen.", "english": "You must not take photos here.", "nepali": "यहाँ फोटो खिच्न मनाही छ।"}]}, {"lesson": "Lesson 15", "grammar_point": "ています for Habitual State", "form": "V て-form います。", "english_explanation": "Besides ongoing action, this also expresses a continuing state or habitual/repeated action.", "nepali_explanation": "चलिरहेको कार्यबाहेक, यसले निरन्तर अवस्था वा नियमित/दोहोरिने कार्य पनि व्यक्त गर्छ।", "examples": [{"japanese": "まいにち およいで います。", "romaji": "Mainichi oyoide imasu.", "english": "I swim every day (as a habit).", "nepali": "म हरेक दिन पौडी खेल्छु।"}]}, {"lesson": "Lesson 15", "grammar_point": "Fixed-location に", "form": "N(place)に Verb／N₁(place)に N₂(object)を Verb。", "english_explanation": "に marks a fixed, specific location associated with an action.", "nepali_explanation": "に ले कार्यसँग सम्बन्धित निश्चित ठाउँ जनाउँछ।", "examples": [{"japanese": "かべに カレンダーを かけます。", "romaji": "Kabe ni karendā o kakemasu.", "english": "I hang the calendar on the wall.", "nepali": "भित्तामा क्यालेन्डर झुण्ड्याउँछु।"}]}, {"lesson": "Lesson 16", "grammar_point": "Chaining Actions: て-form, て-form, ~ます。", "form": "V₁て, V₂て, ~Vます।", "english_explanation": "Connects several sequential actions; only the final verb carries the tense that determines the whole sentence's tense.", "nepali_explanation": "क्रमैसँग हुने कार्यहरूलाई जोड्छ; केवल अन्तिम क्रियापदले पुरा वाक्यको काल निर्धारण गर्छ।", "examples": [{"japanese": "あさ シャワーを あびて、あさごはんを たべて、でかけます。", "romaji": "Asa shawā o abite, asagohan o tabete, dekakemasu.", "english": "In the morning I shower, eat breakfast, and go out.", "nepali": "बिहान शावर लिएर, खाजा खाएर, बाहिर जान्छु।"}]}, {"lesson": "Lesson 16", "grammar_point": "Connecting with い-adjective: くて", "form": "い-adj(くて)、～。", "english_explanation": "Drop the final い and add くて to link an い-adjective clause to another.", "nepali_explanation": "अन्तिम い हटाई くて थपेर वाक्यांश जोड्छ।", "examples": [{"japanese": "この レストランは やすくて、おいしいです。", "romaji": "Kono resutoran wa yasukute, oishii desu.", "english": "This restaurant is cheap and delicious.", "nepali": "यो रेस्टुरेन्ट सस्तो र मीठो छ।"}]}, {"lesson": "Lesson 16", "grammar_point": "Connecting with Noun/な-adjective: で", "form": "Noun/な-adj(で)、～。", "english_explanation": "Drop です and add で to link a noun or な-adjective clause to another. This cannot be used for contradictory ideas (use が instead).", "nepali_explanation": "です हटाई で थपेर नाम वा な-adjective वाक्यांश जोड्छ। विरोधाभासी अर्थका वाक्यांशका लागि यसको प्रयोग गर्न मिल्दैन (त्यसको लागि が प्रयोग गरिन्छ)।", "examples": [{"japanese": "かのじょは しんせつで、あかるいです。", "romaji": "Kanojo wa shinsetsu de, akarui desu.", "english": "She is kind and cheerful.", "nepali": "उनी दयालु र उज्यालो स्वभावको हुनुहुन्छ।"}]}, {"lesson": "Lesson 16", "grammar_point": "Sequential てから", "form": "V₁て-formから、V₂。", "english_explanation": "Expresses doing V2 only after V1 is completed.", "nepali_explanation": "V1 सकिएपछि मात्र V2 गर्छु भनेर व्यक्त गर्छ।", "examples": [{"japanese": "シャワーを あびてから、ねます。", "romaji": "Shawā o abite kara, nemasu.", "english": "After showering, I go to sleep.", "nepali": "शावर लिएपछि सुत्छु।"}]}, {"lesson": "Lesson 16", "grammar_point": "Describing a Feature: N₁は N₂が Adj", "form": "N₁は N₂が Adj です。", "english_explanation": "Describes a specific feature of N1, where N2 is the particular characteristic.", "nepali_explanation": "N1 को कुनै खास विशेषता वर्णन गर्छ, जहाँ N2 त्यो खास गुण हो।", "examples": [{"japanese": "この まちは くうきが きれいです。", "romaji": "Kono machi wa kūki ga kirei desu.", "english": "This town has clean air.", "nepali": "यो शहरको हावा सफा छ।"}]}, {"lesson": "Lesson 16", "grammar_point": "Asking どうやって (How)", "form": "どうやって Verb か。", "english_explanation": "Asks by what method or in what way an action is done.", "nepali_explanation": "कुनै कार्य कुन तरिकाले गरिन्छ भनेर सोध्छ।", "examples": [{"japanese": "えきまで どうやって いきますか。", "romaji": "Eki made dōyatte ikimasu ka.", "english": "How do you get to the station?", "nepali": "स्टेशनसम्म कसरी जानुहुन्छ?"}]}, {"lesson": "Lesson 16", "grammar_point": "どれ／どの N (Which one, of 3+)", "form": "どれ／どの N", "english_explanation": "Asks for a choice among three or more items; どの is always followed by a noun.", "nepali_explanation": "तीन वा सोभन्दा बढी वस्तुबीच छनोट सोध्छ; どの पछि सधैं नाम आउँछ।", "examples": [{"japanese": "あなたの かさは どれですか。", "romaji": "Anata no kasa wa dore desu ka.", "english": "Which one is your umbrella?", "nepali": "तपाईंको छाता कुन हो?"}]}, {"lesson": "Lesson 17", "grammar_point": "Plain Negative: ない-form", "form": "かきます→かかない", "english_explanation": "Group I: change the い-sound before ます to the corresponding あ-sound and add ない (い becomes わ). Group II: drop ます, add ない. Group III: きます→こない, します→しない.", "nepali_explanation": "Group I: ます अघिको い-sound लाई आ-sound मा बदली ない थपिन्छ (い बदलिएर わ बन्छ)। Group II: ます हटाई ない। Group III: きます→こない, します→しない।", "examples": [{"japanese": "よみます → よまない", "romaji": "yomimasu → yomanai", "english": "read → don't read", "nepali": "पढ्छु → पढ्दिन"}]}, {"lesson": "Lesson 17", "grammar_point": "ないでください। (Please don't)", "form": "V ない で ください。", "english_explanation": "Requests someone not to do something.", "nepali_explanation": "कसैलाई केही नगर्नुहोस् भनेर अनुरोध गर्छ।", "examples": [{"japanese": "しゃしんを とらないで ください。", "romaji": "Shashin o toranaide kudasai.", "english": "Please don't take photos.", "nepali": "कृपया फोटो नखिच्नुहोस्।"}]}, {"lesson": "Lesson 17", "grammar_point": "Obligation: なければなりません／ないといけません", "form": "V ないければなりません／V ないといけません", "english_explanation": "Expresses that something must be done.", "nepali_explanation": "कुनै कार्य गर्नैपर्छ भन्ने बाध्यता व्यक्त गर्छ।", "examples": [{"japanese": "あさ はやく おきなければ なりません。", "romaji": "Asa hayaku okinakereba narimasen.", "english": "I must get up early in the morning.", "nepali": "बिहान चाँडो उठ्नैपर्छ।"}]}, {"lesson": "Lesson 17", "grammar_point": "No Obligation: なくてもいいです。", "form": "V ない くても いいです。", "english_explanation": "Says that it's okay not to do something.", "nepali_explanation": "केही नगरे पनि हुन्छ भन्ने कुरा बताउँछ।", "examples": [{"japanese": "きょうは がっこうへ いかなくても いいです。", "romaji": "Kyō wa gakkō e ikanakutemo ii desu.", "english": "You don't have to go to school today.", "nepali": "आज विद्यालय नगए पनि हुन्छ।"}]}, {"lesson": "Lesson 17", "grammar_point": "Object → Topic Shift", "form": "N を → N は", "english_explanation": "The direct object marker を can be replaced with は to make the object the sentence's main topic.", "nepali_explanation": "कर्म (Object) को を लाई は ले बदल्दा त्यो वस्तु वाक्यको मुख्य विषय बन्छ।", "examples": [{"japanese": "この えいがは まだ みて いません。", "romaji": "Kono eiga wa mada mite imasen.", "english": "This movie, I haven't watched yet.", "nepali": "यो चलचित्र अझै हेरेको छैन।"}]}, {"lesson": "Lesson 17", "grammar_point": "Deadline: N(time)までに", "form": "N(time)までに Verb。", "english_explanation": "までに means 'by (a given time)' — the action must be completed within that limit.", "nepali_explanation": "までに को अर्थ 'सम्ममा' हो — त्यो समयभित्र कार्य सकिनुपर्छ।", "examples": [{"japanese": "あしたの あさまでに おくって ください。", "romaji": "Ashita no asa made ni okutte kudasai.", "english": "Please send it by tomorrow morning.", "nepali": "भोलि बिहानसम्ममा पठाउनुहोस्।"}]}, {"lesson": "Lesson 17", "grammar_point": "なくちゃ (spoken shorthand)", "form": "V ないと。", "english_explanation": "A casual shortened way of saying 'must do', dropping いけません from the end.", "nepali_explanation": "'गर्नैपर्छ' भन्ने अनौपचारिक छोटो तरिका, अन्त्यको いけません हटाइन्छ।", "examples": [{"japanese": "もう いかないと……。", "romaji": "Mō ikanai to...", "english": "I really have to go now...", "nepali": "अब जानै पर्छ..."}]}, {"lesson": "Lesson 18", "grammar_point": "Dictionary/Root Form", "form": "たべます→たべる", "english_explanation": "The plain, non-past base form of a verb. Group I changes the い-sound before ます to the corresponding う-sound. Group II drops ます, adds る. Group III: きます→くる, します→する.", "nepali_explanation": "क्रियापदको साधारण, non-past आधारभूत रूप। Group I ले ます अघिको い-sound लाई उ-sound मा बदल्छ। Group II ले ます हटाई る थप्छ। Group III: きます→くる, します→する।", "examples": [{"japanese": "のみます → のむ", "romaji": "nomimasu → nomu", "english": "drink (plain form)", "nepali": "पिउनु (साधारण रूप)"}]}, {"lesson": "Lesson 18", "grammar_point": "Ability: V root ことができます。", "form": "V root こと が できます。", "english_explanation": "Expresses being able to do something.", "nepali_explanation": "कुनै कार्य गर्न सक्ने क्षमता व्यक्त गर्छ।", "examples": [{"japanese": "かのじょは ピアノを ひく ことが できます。", "romaji": "Kanojo wa piano o hiku koto ga dekimasu.", "english": "She can play the piano.", "nepali": "उनी पियानो बजाउन सक्नुहुन्छ।"}]}, {"lesson": "Lesson 18", "grammar_point": "Talking About Hobbies", "form": "わたしのしゅみは…です。", "english_explanation": "States one's own hobby or interest, using either a noun or Verb-root こと.", "nepali_explanation": "आफ्नो शौक वा रुचि व्यक्त गर्छ, नाम वा क्रिया-root+こと प्रयोग गरेर।", "examples": [{"japanese": "わたしの しゅみは りょうりを つくる ことです。", "romaji": "Watashi no shumi wa ryōri o tsukuru koto desu.", "english": "My hobby is cooking.", "nepali": "मेरो शौक खाना पकाउनु हो।"}]}, {"lesson": "Lesson 18", "grammar_point": "Before Doing: V root／N の まえに", "form": "V root／Nounの まえに、V₂", "english_explanation": "V2 happens before V1 (always in root form); if a noun-of-action precedes まえに, の is inserted; period-quantifiers before まえに don't need の.", "nepali_explanation": "V1 (सधैं root form मा) हुनु अघि V2 हुन्छ; क्रियात्मक-नामको हकमा まえに अघि の थपिन्छ; समय-अवधिको हकमा の चाहिँदैन।", "examples": [{"japanese": "たべる まえに、てを あらいます。", "romaji": "Taberu mae ni, te o araimasu.", "english": "Before eating, I wash my hands.", "nepali": "खानुअघि हात धुन्छु।"}]}, {"lesson": "Lesson 18", "grammar_point": "なかなか (not easily)", "form": "なかなか + negative", "english_explanation": "Paired with a negative verb, means 'not easily/not readily'.", "nepali_explanation": "नकारात्मक क्रियापदसँग जोडिँदा 'सजिलैसँग होइन' भन्ने अर्थ दिन्छ।", "examples": [{"japanese": "しごとが なかなか みつかりません。", "romaji": "Shigoto ga nakanaka mitsukarimasen.", "english": "I can't easily find a job.", "nepali": "काम सजिलैसँग भेटिँदैन।"}]}, {"lesson": "Lesson 18", "grammar_point": "ぜひ (by all means)", "form": "ぜひ + desire expression", "english_explanation": "Emphasizes a wish or request, meaning 'definitely/really'.", "nepali_explanation": "इच्छा वा अनुरोधलाई जोड दिन्छ, अर्थ 'पक्का/साँच्चै'।", "examples": [{"japanese": "ぜひ いっしょに いきたいです。", "romaji": "Zehi issho ni ikitai desu.", "english": "I really want to go together.", "nepali": "साँच्चै सँगै जान चाहन्छु।"}]}, {"lesson": "Lesson 19", "grammar_point": "Plain Past: た-form", "form": "たべます→たべた", "english_explanation": "Formed the same way as て-form, with て→た and で→だ.", "nepali_explanation": "て-form बनाउने तरिकैले बनाइन्छ, फरक यत्ति हो कि て→た र で→だ हुन्छ।", "examples": [{"japanese": "よみます → よんで → よんだ", "romaji": "yomimasu → yonde → yonda", "english": "read → (te-form) → read (past)", "nepali": "पढ्छु → (ते-रूप) → पढेँ"}]}, {"lesson": "Lesson 19", "grammar_point": "Past Experience: たことがあります。", "form": "V た-form ことが あります。", "english_explanation": "Expresses having done something before.", "nepali_explanation": "पहिले कुनै कार्य गरेको अनुभव व्यक्त गर्छ।", "examples": [{"japanese": "インドへ いった ことが あります。", "romaji": "Indo e itta koto ga arimasu.", "english": "I have been to India before.", "nepali": "भारत गएको छु।"}]}, {"lesson": "Lesson 19", "grammar_point": "Forming たり／だり", "form": "V た-form + り", "english_explanation": "Add り to the た-form to make the たり-form.", "nepali_explanation": "た-form मा り थपेर たり-form बनाइन्छ।", "examples": [{"japanese": "よんだ → よんだり", "romaji": "yonda → yondari", "english": "read (representative action)", "nepali": "पढ्नु (उदाहरणात्मक)"}]}, {"lesson": "Lesson 19", "grammar_point": "Listing Examples: たり、たり、します。", "form": "V₁たり、V₂たり、～します。", "english_explanation": "Gives representative examples of activities from among several — 'doing things like V1 and V2'.", "nepali_explanation": "एकभन्दा बढी क्रियाकलापबाट प्रतिनिधि उदाहरणहरू दिन्छ — 'यस्तो-उस्तो गर्छु' भन्ने अर्थमा।", "examples": [{"japanese": "しゅうまつは ほんを よんだり、おんがくを きいたり します。", "romaji": "Shūmatsu wa hon o yondari, ongaku o kiitari shimasu.", "english": "On weekends I do things like reading and listening to music.", "nepali": "हप्ताको अन्त्यमा किताब पढ्ने, संगीत सुन्ने गर्छु।"}]}, {"lesson": "Lesson 19", "grammar_point": "Change of State: なります", "form": "い-adj→く／な-adj→に／Noun に なります。", "english_explanation": "なります means 'become/change into'.", "nepali_explanation": "なります को अर्थ 'हुन्छ/बन्छ' हो।", "examples": [{"japanese": "むすこは いしゃに なりました。", "romaji": "Musuko wa isha ni narimashita.", "english": "My son became a doctor.", "nepali": "मेरो छोरा डाक्टर बन्यो।"}]}, {"lesson": "Lesson 20", "grammar_point": "Plain Form (Overview)", "form": "Polite → Plain", "english_explanation": "Plain form is used with people close to or below the speaker's status, not with superiors.", "nepali_explanation": "साधारण रूप वक्ताभन्दा नजिकका वा तल्लो स्तरका मानिससँग प्रयोग गरिन्छ, माथिल्लो स्तरका मानिससँग होइन।", "examples": [{"japanese": "たべます → たべる", "romaji": "tabemasu → taberu", "english": "eat (polite) → eat (plain)", "nepali": "खान्छु (नम्र) → खान्छु (साधारण)"}]}, {"lesson": "Lesson 20", "grammar_point": "Plain Form Question/Answer", "form": "…か。 → …？／うん・ううん", "english_explanation": "In casual speech, か is dropped for rising intonation, and はい/いいえ become うん/ううん.", "nepali_explanation": "अनौपचारिक बोलीमा か हटेर स्वर उठाइन्छ, र はい/いいえ को सट्टा うん/ううん आउँछ।", "examples": [{"japanese": "それ、たべる？ うん、たべる。", "romaji": "Sore, taberu? Un, taberu.", "english": "Will you eat that? Yeah, I will.", "nepali": "त्यो खानुहुन्छ? हो, खान्छु।"}]}, {"lesson": "Lesson 20", "grammar_point": "Casual Word Equivalents", "form": "わたし→ぼく、あなた→きみ、～さん→～くん", "english_explanation": "Informal words used casually, often by men or between peers: ぼく (I), きみ (you), ～くん (informal ~-san).", "nepali_explanation": "अनौपचारिक शब्दहरू, प्रायः पुरुष वा समान स्तरका मानिसबीच प्रयोग हुन्छन्।", "examples": [{"japanese": "ぼくは にじゅっさいだ。", "romaji": "Boku wa nijussai da.", "english": "I'm 20 years old. (informal, male)", "nepali": "म २० वर्षको हो। (अनौपचारिक)"}]}, {"lesson": "Lesson 20", "grammar_point": "Informal Directions", "form": "こっち/そっち/あっち/どっち", "english_explanation": "Casual equivalents of こちら/そちら/あちら/どちら.", "nepali_explanation": "こちら/そちら/あちら/どちら का अनौपचारिक रूप।", "examples": [{"japanese": "こっちに きて。", "romaji": "Kocchi ni kite.", "english": "Come over here.", "nepali": "यता आऊ।"}]}, {"lesson": "Lesson 21", "grammar_point": "Opinion: Plain Form と おもいます。", "form": "Plain Form と おもいます。", "english_explanation": "States the speaker's own opinion or guess. To ask someone's opinion, use ～に ついて どう おもいますか (と is not needed after どう here).", "nepali_explanation": "वक्ताको आफ्नो धारणा वा अनुमान व्यक्त गर्छ। अरूको राय सोध्न ～に ついて どう おもいますか प्रयोग गरिन्छ।", "examples": [{"japanese": "あの レストランは たかいと おもいます。", "romaji": "Ano resutoran wa takai to omoimasu.", "english": "I think that restaurant is expensive.", "nepali": "त्यो रेस्टुरेन्ट महँगो छ जस्तो लाग्छ।"}]}, {"lesson": "Lesson 21", "grammar_point": "Reporting Speech: と いいました。", "form": "Plain Form と いいました。", "english_explanation": "Reports what someone else said.", "nepali_explanation": "कसैले भनेको कुरा जस्ताको त्यस्तै रिपोर्ट गर्छ।", "examples": [{"japanese": "いしゃは やすんだ ほうが いいと いいました。", "romaji": "Isha wa yasunda hō ga ii to iimashita.", "english": "The doctor said it's better to rest.", "nepali": "डाक्टरले आराम गर्नु राम्रो हुन्छ भन्नुभयो।"}]}, {"lesson": "Lesson 21", "grammar_point": "Confirming: でしょう？", "form": "Plain Form + でしょう？", "english_explanation": "Confirms something the listener is expected to already agree with — 'isn't that right?'.", "nepali_explanation": "श्रोताले पहिल्यै सहमत हुने अपेक्षा गरिएको कुरा पुष्टि गर्छ।", "examples": [{"japanese": "この みちは わかりにくいでしょう？", "romaji": "Kono michi wa wakarinikui deshō?", "english": "This road is hard to find, isn't it?", "nepali": "यो बाटो चिन्न गाह्रो छ हगि?"}]}, {"lesson": "Lesson 21", "grammar_point": "Event happens: N₁(place)で N₂が あります。", "form": "N₁(place)で N₂が あります।", "english_explanation": "When N2 is an event, あります means 'is being held/takes place'.", "nepali_explanation": "N2 कुनै event भएमा, あります को अर्थ 'हुन गइरहेको छ' हुन्छ।", "examples": [{"japanese": "こうえんで まつりが あります。", "romaji": "Kōen de matsuri ga arimasu.", "english": "There is a festival happening in the park.", "nepali": "पार्कमा मेला हुन गइरहेको छ।"}]}, {"lesson": "Lesson 21", "grammar_point": "Occasion Marker で", "form": "N(occasion)で", "english_explanation": "で marks the specific occasion during which an action occurs.", "nepali_explanation": "で ले कार्य हुने खास अवसर जनाउँछ।", "examples": [{"japanese": "けっこんしきで この しゃしんを とりました。", "romaji": "Kekkonshiki de kono shashin o torimashita.", "english": "I took this photo at the wedding.", "nepali": "विवाहमा यो फोटो खिचें।"}]}, {"lesson": "Lesson 21", "grammar_point": "Suggesting with でも", "form": "N でも Verb", "english_explanation": "Gives one example among similar options as a suggestion.", "nepali_explanation": "मिल्दोजुल्दो विकल्पहरूबाट एउटा उदाहरण दिएर सुझाव दिन्छ।", "examples": [{"japanese": "コーヒーでも のみませんか。", "romaji": "Kōhī demo nomimasen ka.", "english": "Won't you have coffee or something?", "nepali": "कफी भए पनि पिउने हैन?"}]}, {"lesson": "Lesson 21", "grammar_point": "Shortened Obligation: ないと…", "form": "V ないと。", "english_explanation": "Casual shortened form of ないと いけません, meaning 'have to'.", "nepali_explanation": "ないと いけません को छोटो अनौपचारिक रूप, अर्थ 'गर्नैपर्छ'।", "examples": [{"japanese": "じかんが ない……。もう でないと……。", "romaji": "Jikan ga nai... Mō denai to...", "english": "There's no time... I have to leave now...", "nepali": "समय छैन... अब निस्कनैपर्छ..."}]}, {"lesson": "Lesson 22", "grammar_point": "Basic Noun Modification", "form": "Adjective/Noun + Noun", "english_explanation": "A noun can be preceded by an adjective or another noun (with の) to modify it.", "nepali_explanation": "नामलाई अगाडिबाट विशेषण वा अर्को नाम (の सहित) ले परिमार्जन गर्न सकिन्छ।", "examples": [{"japanese": "あかるい へや (a bright room)", "romaji": "akarui heya", "english": "a bright room", "nepali": "उज्यालो कोठा"}]}, {"lesson": "Lesson 22", "grammar_point": "Modifying a Noun with a Clause", "form": "Plain Form Sentence + Noun", "english_explanation": "A whole clause in plain form can modify a noun like a relative clause. For な-adjective clauses use ～な instead of ～だ; for noun clauses use ～の instead of ～だ. The whole modified phrase then functions as a single noun.", "nepali_explanation": "पुरै वाक्यांश (plain form मा) ले नामलाई अंग्रेजीको relative clause जस्तै परिमार्जन गर्न सक्छ। な-adjective को हकमा ～な, र noun को हकमा ～の प्रयोग हुन्छ।", "examples": [{"japanese": "きのう かった ふく (the clothes I bought yesterday)", "romaji": "kinō katta fuku", "english": "the clothes I bought yesterday", "nepali": "हिजो किनेको लुगा"}]}, {"lesson": "Lesson 22", "grammar_point": "Verb Root before じかん/やくそく/ようじ", "form": "V root + じかん/やくそく/ようじ", "english_explanation": "The verb takes the root form before words like じかん (time), やくそく (promise), and ようじ (errand).", "nepali_explanation": "じかん、やくそく र ようじ जस्ता शब्दहरूअघि क्रियापद root form मा राखिन्छ।", "examples": [{"japanese": "ともだちと あそぶ じかんが ありません。", "romaji": "Tomodachi to asobu jikan ga arimasen.", "english": "I don't have time to play with friends.", "nepali": "साथीसँग खेल्ने समय छैन।"}]}, {"lesson": "Lesson 23", "grammar_point": "とき (when): forms", "form": "…とき、～ (main clause)", "english_explanation": "とき means 'when/at the time'; it links two clauses to indicate the timing of the main action. If the noun before とき relates to time of day (like morning/noon/night), の is not used.", "nepali_explanation": "とき को अर्थ 'बेला/समय' हो; यसले दुई वाक्यांश जोड्छ र मुख्य कार्यको समय जनाउँछ।", "examples": [{"japanese": "じかんが ある とき、りょうりを つくります。", "romaji": "Jikan ga aru toki, ryōri o tsukurimasu.", "english": "When I have time, I cook.", "nepali": "समय हुँदा खाना पकाउँछु।"}]}, {"lesson": "Lesson 23", "grammar_point": "とき: Root vs た-form nuance", "form": "V root/V たform + とき", "english_explanation": "Root form before とき shows the action hadn't finished yet; た-form before とき shows it had already finished.", "nepali_explanation": "とき अघि root form ले कार्य नसकिएको, र た-form ले कार्य सकिइसकेको जनाउँछ।", "examples": [{"japanese": "いえを でる とき、かぎを かけました。", "romaji": "Ie o deru toki, kagi o kakemashita.", "english": "When (about to) leave the house, I locked the door.", "nepali": "घरबाट निस्कने बेला ताला लगाएँ।"}, {"japanese": "いえに ついた とき、あめが やみました。", "romaji": "Ie ni tsuita toki, ame ga yamimashita.", "english": "When I had arrived home, the rain had stopped.", "nepali": "घर पुगिसकेको बेला पानी रोकिएको थियो।"}]}, {"lesson": "Lesson 23", "grammar_point": "Automatic Result: Verb Root と、～", "form": "V root と、～", "english_explanation": "Connects clauses when a result naturally or inevitably follows a condition, like a rule or mechanism. Not used for wishes, invitations, or requests — たら (Lesson 25) is used for those.", "nepali_explanation": "कुनै अवस्थापछि निश्चित परिणाम अनिवार्यरूपमा आउँछ भने प्रयोग हुन्छ, नियम/मेकानिज्म जनाउन। इच्छा, निमन्त्रणा वा अनुरोधका लागि होइन।", "examples": [{"japanese": "はるに なると、はなが さきます。", "romaji": "Haru ni naru to, hana ga sakimasu.", "english": "When spring comes, flowers bloom.", "nepali": "वसन्त आएपछि फुल फुल्छ।"}]}, {"lesson": "Lesson 23", "grammar_point": "Existing State: Noun が Adjective", "form": "Noun が Adjective です。", "english_explanation": "Describes a currently existing state or condition.", "nepali_explanation": "अहिले विद्यमान अवस्था वर्णन गर्छ।", "examples": [{"japanese": "この みせは ねだんが たかいです。", "romaji": "Kono mise wa nedan ga takai desu.", "english": "This shop's prices are high.", "nepali": "यो पसलको मूल्य महँगो छ।"}]}, {"lesson": "Lesson 23", "grammar_point": "Path Marker N(place)を", "form": "N(place)を Verb", "english_explanation": "を marks the route or place through which a movement action passes.", "nepali_explanation": "を ले हिँडाइको कार्य गुज्रने ठाउँ जनाउँछ।", "examples": [{"japanese": "まいあさ かわを はしります。", "romaji": "Maiasa kawa o hashirimasu.", "english": "I run along the river every morning.", "nepali": "हरेक बिहान नदीछेउ दौडिन्छु।"}]}, {"lesson": "Lesson 24", "grammar_point": "くれます (someone gives me)", "form": "N は わたしに N₂を くれます。", "english_explanation": "Used instead of あげます when the speaker (or the speaker's family) is the one receiving.", "nepali_explanation": "वक्ता (वा वक्ताको परिवार) ले नै कुनै कुरा पाउँदा あげます को साटो यो प्रयोग गरिन्छ।", "examples": [{"japanese": "ともだちが たんじょうびに プレゼントを くれました。", "romaji": "Tomodachi ga tanjōbi ni purezento o kuremashita.", "english": "My friend gave me a present for my birthday.", "nepali": "मेरो जन्मदिनमा साथीले उपहार दिनुभयो।"}]}, {"lesson": "Lesson 24", "grammar_point": "て-form + あげます/もらいます/くれます", "form": "V て-form あげます/もらいます/くれます", "english_explanation": "Adds a sense of favor or gratitude: あげます (doing something for someone), もらいます (gratefully receiving a favor), くれます (someone kindly doing something for the speaker/family).", "nepali_explanation": "सद्भावना वा कृतज्ञताको भाव थप्छ: あげます (कसैका लागि गरिदिनु), もらいます (कृतज्ञतापूर्वक पाउनु), くれます (कसैले वक्ता/परिवारका लागि गरिदिनु)।", "examples": [{"japanese": "いもうとに にほんごを おしえて あげました。", "romaji": "Imōto ni nihongo o oshiete agemashita.", "english": "I taught my younger sister Japanese.", "nepali": "बहिनीलाई जापानी भाषा सिकाईदिएँ।"}, {"japanese": "せんぱいに しごとを てつだって もらいました。", "romaji": "Senpai ni shigoto o tetsudatte moraimashita.", "english": "My senior kindly helped me with work.", "nepali": "सिनियरले काम गर्न सहयोग गरिदिनुभयो।"}]}, {"lesson": "Lesson 24", "grammar_point": "New Information Marker: N₁は N₂が Verb", "form": "N₁は N₂が Verb।", "english_explanation": "が marks the part of the sentence conveying new information.", "nepali_explanation": "が ले वाक्यमा नयाँ जानकारी बताउने अंश जनाउँछ।", "examples": [{"japanese": "すてきな とけいですね。 ええ、はははが くれました。", "romaji": "Suteki na tokei desu ne. Ee, haha ga kuremashita.", "english": "What a nice watch! Yes, my mother gave it to me.", "nepali": "कति राम्रो घडी! हजुर, आमाले दिनुभएको।"}]}, {"lesson": "Lesson 24", "grammar_point": "Asking だれが (Who did it)", "form": "だれが Verb か。", "english_explanation": "Asks who performed a certain action.", "nepali_explanation": "कुनै कार्य कसले गर्यो भनेर सोध्छ।", "examples": [{"japanese": "だれが まどを あけましたか。", "romaji": "Dare ga mado o akemashita ka.", "english": "Who opened the window?", "nepali": "झ्याल कसले खोल्यो?"}]}, {"lesson": "Lesson 25", "grammar_point": "Conditional: Plain Past + ら", "form": "Plain Past Form ら、～", "english_explanation": "Expresses 'if this happens, then...' as a hypothetical or conditional situation.", "nepali_explanation": "'यदि यसो भयो भने' भन्ने काल्पनिक वा शर्तयुक्त अवस्था व्यक्त गर्छ।", "examples": [{"japanese": "じかんが あったら、てつだって ください。", "romaji": "Jikan ga attara, tetsudatte kudasai.", "english": "If you have time, please help me.", "nepali": "समय भएमा सहयोग गरिदिनुहोस्।"}]}, {"lesson": "Lesson 25", "grammar_point": "Sequential Result: たら", "form": "V たform ら、～", "english_explanation": "Says V2 happens after V1 is completed; V2 (the main clause) is usually in the present tense.", "nepali_explanation": "V1 सकिएपछि V2 हुन्छ भन्ने कुरा बताउँछ; V2 सामान्यतया वर्तमानकालमा हुन्छ।", "examples": [{"japanese": "いえに ついたら、でんわします。", "romaji": "Ie ni tsuitara, denwa shimasu.", "english": "Once I get home, I'll call.", "n
