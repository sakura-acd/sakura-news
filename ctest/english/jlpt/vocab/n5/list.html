  <style>
    body { font-family:'Outfit',sans-serif; transition:background .3s,color .3s; }

    .drop.open   { opacity:1; transform:translateY(0);    pointer-events:all; }

    }

    .word-kana { font-weight:700; font-size:16px; color:#1f2937; }
    .word-meaning { font-weight:700; color:#1e9e83; }
    .speak-btn { width:34px; height:34px; border-radius:9999px; background:#e3f6ef; color:#1e9e83; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:none; cursor:pointer; transition:transform .15s ease; }

    .example-jp { font-size:17px; font-weight:600; color:#1f2937; line-height:1.9; }

<!-- ═══════════════ SCRIPTS ═══════════════ -->
<script>
/* ── Dark mode ── */
let isDark = false;
const MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
const SUN  = '<path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/><circle cx="12" cy="12" r="4"/>';
function toggleDark() {
  isDark = !isDark;
  document.body.className = isDark ? 'mesh-dark min-h-screen text-slate-100 dark' : 'mesh-light min-h-screen text-ink';
  ['mob-icon','desk-icon'].forEach(id => { const el = document.getElementById(id); if(el) el.innerHTML = isDark ? SUN : MOON; });
  const lbl = document.getElementById('desk-lbl'); if(lbl) lbl.textContent = isDark ? 'Light mode' : 'Dark mode';
}

/* ── Scroll-direction nav show/hide ── */
(function(){
  let lastY = window.scrollY;
  const topbar = document.getElementById('topbar');
  const botnav = document.getElementById('botnav');
  window.addEventListener('scroll', function(){
    const y = window.scrollY;
    const goingDown = y > lastY;
    if (y < 10) { if (topbar) topbar.style.transform='translateY(0)'; if (botnav) botnav.style.transform='translateY(0)'; }
    else if (goingDown) { if (botnav) botnav.style.transform='translateY(150%)'; if (topbar) topbar.style.transform='translateY(0)'; }
    else { if (topbar) topbar.style.transform='translateY(-100%)'; if (botnav) botnav.style.transform='translateY(0)'; }
    lastY = y;
  }, { passive: true });
})();

/* ── Cached user name/avatar (matches homepage) ── */
(function(){
  var cachedName = localStorage.getItem('sakura_user_name');
  if (cachedName) {
    ['sb-name','mob-drop-name','desk-drop-name'].forEach(function(id){ var el=document.getElementById(id); if(el) el.textContent=cachedName; });
  }
})();

/* ── Desktop profile dropdown ── */
let deskProfOpen = false;
function toggleDeskProf() {
  deskProfOpen = !deskProfOpen;
  const drop = document.getElementById('desk-prof-drop');
  const chev = document.getElementById('desk-prof-chev');
  drop.className = drop.className.replace(/\b(open|closed)\b/, deskProfOpen ? 'open' : 'closed');
  if(chev) chev.style.transform = deskProfOpen ? 'rotate(180deg)' : '';
}

/* ── Site language — single-button toggle (click to switch EN ↔ NP).
   Also drives which language word meanings show in, since this page
   doesn't need two separate language switches. ── */
var vocabLang = 'np';
function toggleSiteLang() {
  vocabLang = (vocabLang === 'np') ? 'en' : 'np';
  var label = vocabLang === 'np' ? 'NP' : 'EN';
  ['desk-lang-btn-label','mob-lang-btn-label'].forEach(function(id){ var el=document.getElementById(id); if(el) el.textContent=label; });
  renderPage();
}

/* ── Mobile profile dropdown ── */
const drops = { prof: false };
function toggleDrop(name) {
  drops[name] = !drops[name];
  const el = document.getElementById(name === 'prof' ? 'prof-drop' : null);
  if(el) el.className = el.className.replace(/\b(open|closed)\b/, drops[name] ? 'open' : 'closed');
}
document.addEventListener('click', e => {
  const deskProfWrap = document.getElementById('desk-prof-wrap');
  if(deskProfWrap && !deskProfWrap.contains(e.target) && deskProfOpen) {
    deskProfOpen = false;
    const drop = document.getElementById('desk-prof-drop'), chev = document.getElementById('desk-prof-chev');
    if(drop) drop.className = drop.className.replace(/\b(open|closed)\b/,'closed');
    if(chev) chev.style.transform = '';
  }
  const pb = document.getElementById('prof-wrap');
  if(pb && !pb.contains(e.target) && drops.prof) { drops.prof = false; const el=document.getElementById('prof-drop'); if(el) el.className = el.className.replace(/\b(open|closed)\b/,'closed'); }
});

/* ══════════════════════════════════════════════════════════
   Category classification — same 4-bucket logic as index.html
   (All / Noun / Adjective / Verb)
   ══════════════════════════════════════════════════════════ */
var VOCAB_ADJECTIVE_MATCH = /i-Adjectives|na-Adjectives/i;
var VOCAB_VERB_MATCH = /Verbs Group 1|Verbs Group 5|Irregular Verbs/i;
var BUCKET_META = {
  all:       { label:'All' },
  noun:      { label:'Noun' },
  adjective: { label:'Adjective' },
  verb:      { label:'Verb' },
};

var allWords = [];
var currentWords = [];

function getBucketFor(categoryName){
  if (VOCAB_ADJECTIVE_MATCH.test(categoryName)) return 'adjective';
  if (VOCAB_VERB_MATCH.test(categoryName)) return 'verb';
  return 'noun';
}
function getParam(name){ return new URLSearchParams(window.location.search).get(name); }

function loadWords(){
  var cat = (getParam('cat') || 'all').toLowerCase();
  fetch('vocab-n5-data.json')
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data){
      (data.categories || []).forEach(function(c){
        var bucket = getBucketFor(c.name);
        (c.words || []).forEach(function(w){
          allWords.push(Object.assign({}, w, { bucket: bucket }));
        });
      });

      var meta = BUCKET_META[cat] || BUCKET_META.all;
      document.getElementById('page-title').textContent = meta.label;
      document.title = meta.label + ' Vocabulary (N5) — Shikaku';

      currentWords = (cat === 'all') ? allWords.slice() : allWords.filter(function(w){ return w.bucket === cat; });
      renderList(currentWords);
      document.getElementById('list-loading').classList.add('hidden');
    })
    .catch(function(err){
      document.getElementById('list-loading').textContent = 'Could not load vocab-n5-data.json.';
      console.warn('Vocab list load failed:', err);
    });
}

function escapeHtml(s){
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

var PAGE_SIZE = 20;
var currentPage = 0;
var filteredWords = [];

function renderList(words){
  filteredWords = words;
  currentPage = 0;
  renderPage();
}

function renderPage(){
  var listEl = document.getElementById('word-list');
  var emptyEl = document.getElementById('list-empty');
  var pagEl = document.getElementById('pagination');
  document.getElementById('word-count').textContent = filteredWords.length;

  if (!filteredWords.length){
    listEl.innerHTML = '';
    emptyEl.classList.remove('hidden');
    pagEl.classList.add('hidden');
    return;
  }
  emptyEl.classList.add('hidden');

  var totalPages = Math.max(1, Math.ceil(filteredWords.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, totalPages - 1);
  var start = currentPage * PAGE_SIZE;
  var pageWords = filteredWords.slice(start, start + PAGE_SIZE);

  listEl.innerHTML = pageWords.map(function(w, i){
    var absIndex = start + i;
    var meaning = vocabLang === 'np' ? (w.meaning_np || w.english || '') : (w.english || w.meaning_np || '');
    var exampleTranslated = vocabLang === 'np' ? (w.example_np || w.example_en || '') : (w.example_en || w.example_np || '');
    return '' +
      '<div class="word-card fu" style="animation-delay:' + Math.min(i*0.015, 0.3) + 's;">' +
        '<div class="flex items-start justify-between gap-3 mb-2.5">' +
          '<div class="flex-1 min-w-0 flex flex-wrap items-baseline gap-x-1.5">' +
            '<span class="jp word-head">' + escapeHtml(w.kanji || w.kana) + '</span>' +
            (w.kanji ? '<span class="jp word-kana">（' + escapeHtml(w.kana) + '）</span>' : '') +
            '<span class="t-muted font-bold">—</span>' +
            '<span class="word-meaning">' + escapeHtml(meaning) + '</span>' +
          '</div>' +
          '<button class="speak-btn" onclick="speakWord(' + absIndex + ')" aria-label="Play pronunciation">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="example-jp">' + (w.example || '') + '</div>' +
        (exampleTranslated ? '<div class="np-line">' + escapeHtml(exampleTranslated) + '</div>' : '') +
      '</div>';
  }).join('');

  /* Pagination controls */
  if (totalPages > 1){
    pagEl.classList.remove('hidden');
    document.getElementById('page-indicator').textContent = 'Page ' + (currentPage+1) + ' of ' + totalPages;
    document.getElementById('prev-btn').disabled = currentPage === 0;
    document.getElementById('next-btn').disabled = currentPage === totalPages - 1;
  } else {
    pagEl.classList.add('hidden');
  }

  window.scrollTo({ top: document.getElementById('word-list').offsetTop - 80, behavior: 'smooth' });
}

function goNextPage(){
  var totalPages = Math.max(1, Math.ceil(filteredWords.length / PAGE_SIZE));
  if (currentPage < totalPages - 1){ currentPage++; renderPage(); }
}
function goPrevPage(){
  if (currentPage > 0){ currentPage--; renderPage(); }
}

/* ── Text-to-speech playback (uses the browser's Japanese voice if available) ── */
function speakWord(i){
  var w = filteredWords[i];
  if (!w) return;
  try {
    var utter = new SpeechSynthesisUtterance((w.kanji || w.kana));
    utter.lang = 'ja-JP';
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
  } catch(e) { console.warn('Speech synthesis not available:', e); }
}

loadWords();
</script>

<script>
(function(){
  var PAGE='vocab/n5/list.html'; var PROG=0;
  try {
    var list = JSON.parse(localStorage.getItem('Sakura_recent') || '[]');
    list = list.filter(function(x){ return x.url !== PAGE; });
    list.unshift({ url: PAGE, ts: Date.now(), prog: PROG });
    if(list.length > 10) list = list.slice(0, 10);
    localStorage.setItem('Sakura_recent', JSON.stringify(list));
  } catch(e) {}
})();
</script>
